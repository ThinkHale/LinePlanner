                const S = (r, c, s) => { const a = XLSX.utils.encode_cell({ r, c }); if (ws[a]) ws[a].s = s; };
                const range = XLSX.utils.decode_range(ws['!ref']);
                ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: lastCol } }, { s: { r: indHdrRow, c: 0 }, e: { r: indHdrRow, c: lastCol } }];

                S(0, 0, { font: { bold: true, sz: 16, color: { rgb: 'FFFFFF' } }, fill: { patternType: 'solid', fgColor: { rgb: '374151' } }, alignment: { horizontal: 'center', vertical: 'center' }, border: grid });
                for (let c = 0; c <= lastCol; c++) {
                    S(1, c, { font: { bold: true, sz: 10 }, fill: { patternType: 'solid', fgColor: { rgb: 'E5E7EB' } }, alignment: { horizontal: 'center' }, border: grid });
                    S(2, c, { font: { sz: 10 }, fill: { patternType: 'solid', fgColor: { rgb: 'F3F4F6' } }, alignment: { horizontal: 'center' }, border: grid });
                }
                let ci = 0;
                lines.forEach(l => {
                    S(4, ci, { font: { bold: true, sz: 12, color: { rgb: 'FFFFFF' } }, fill: { patternType: 'solid', fgColor: { rgb: l.isCut ? '991B1B' : '374151' } }, alignment: { horizontal: 'center', vertical: 'center' }, border: grid });
                    S(5, ci, { font: { italic: true, sz: 10 }, fill: { patternType: 'solid', fgColor: { rgb: 'F9FAFB' } }, alignment: { horizontal: 'center' }, border: grid });
                    ci += 2;
                });
                S(4, lastCol, { font: { bold: true, sz: 12, color: { rgb: 'FFFFFF' } }, fill: { patternType: 'solid', fgColor: { rgb: '92400E' } }, alignment: { horizontal: 'center', vertical: 'center' }, border: grid });
                S(5, lastCol, { font: { italic: true, sz: 10 }, fill: { patternType: 'solid', fgColor: { rgb: 'FEF9C3' } }, alignment: { horizontal: 'center' }, border: grid });
                for (let R = 6; R < 6 + maxPos; R++) {
                    ci = 0;
                    lines.forEach(l => {
                        const a = XLSX.utils.encode_cell({ r: R, c: ci });
                        const v = ((ws[a] && ws[a].v) || '').toString();
                        const empty = !v.trim(); const nw = v.includes('⭐');
                        S(R, ci, { font: { sz: 11 }, fill: { patternType: 'solid', fgColor: { rgb: empty ? 'FFFFFF' : nw ? 'DBEAFE' : l.isCut ? 'FEE2E2' : 'ECFDF5' } }, alignment: { vertical: 'center' }, border: grid });
                        ci += 2;
                    });
                    const a = XLSX.utils.encode_cell({ r: R, c: lastCol });
                    const v = ((ws[a] && ws[a].v) || '').toString();
                    S(R, lastCol, { font: { sz: 11 }, fill: { patternType: 'solid', fgColor: { rgb: !v.trim() ? 'FFFFFF' : v.includes('⭐') ? 'DBEAFE' : 'FEF9C3' } }, alignment: { vertical: 'center' }, border: grid });
                }
                S(indHdrRow, 0, { font: { bold: true, sz: 11, color: { rgb: 'FFFFFF' } }, fill: { patternType: 'solid', fgColor: { rgb: '3730A3' } }, alignment: { horizontal: 'left', vertical: 'center' }, border: grid });
                for (let R = indHdrRow + 1; R <= range.e.r; R++) {
                    S(R, 0, { font: { sz: 11 }, fill: { patternType: 'solid', fgColor: { rgb: 'EEF2FF' } }, alignment: { vertical: 'center' }, border: grid });
                }
                ws['!rows'] = [{ hpt: 22 }];
                ws['!margins'] = { left: 0.25, right: 0.25, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 };

                XLSX.utils.book_append_sheet(wb, ws, 'Staffing');

                const fileName = `staffing-${currentDate}-${currentShift}.xlsx`;
                // SheetJS can't write fit-to-page print settings, so post-process the
                // xlsx zip to inject landscape + fit-to-one-page. Fall back to a plain
                // save if JSZip isn't available.
                try {
                    if (typeof JSZip === 'undefined') throw new Error('no-jszip');
                    const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
                    const zip = await JSZip.loadAsync(out);
                    let xml = await zip.file('xl/worksheets/sheet1.xml').async('string');
                    // Landscape; fit all rows onto ONE page tall (so a line's names never
                    // split across pages) but let columns flow across pages (a bunch of
                    // lines can span two pages wide).
                    xml = xml.replace(/(<worksheet[^>]*>)/, '$1<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>');
                    xml = xml.replace(/(<pageMargins[^>]*\/>)/, '$1<pageSetup orientation="landscape" fitToWidth="0" fitToHeight="1"/>');
                    zip.file('xl/worksheets/sheet1.xml', xml);
                    const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = fileName;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1500);
                } catch (err) {
                    console.error('Fit-to-page post-process failed, saving plain:', err);
                    XLSX.writeFile(wb, fileName);
                }
            };

            // Print via a purpose-built landscape document rendered into a hidden

            // nested in @media print (so orientation stayed portrait) and paginates

            const handlePrint = () => {
                const lastFirst = storage.load('nameDisplayLastFirst', false);

                const esc = (s) => (s || '').toString().replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

                const activeLines = lines.filter(l => !l.isCut);
                const cutLines = lines.filter(l => l.isCut);
                const totalPositions = activeLines.reduce((s, l) => s + (parseInt(l.needed) || 0), 0);
                const filledPositions = activeLines.reduce((s, l) => s + l.positions.filter(p => p.name.trim()).length, 0);
                const newAssociates = activeLines.reduce((s, l) => s + l.positions.filter(p => p.name.trim() && p.isNew).length, 0);
                const unassignedCount = dailyRoster.filter(w => w.name.trim()).length;
                const indirectNames = (indirect || []).filter(i => i.name.trim());

                const posRow = (p, num) => {
                    const filled = p.name.trim() !== '';

                    return `<div class="pos ${cls}"><span class="n">${num}</span><span class="nm">${filled ? esc(fmtName(p.name)) + (p.isNew ? ' ★' : '') : ''}</span></div>`;
                };

                    const leads = (l.leads || (l.lead ? [l.lead] : [])).join(', ') || 'No lead';
                    const fc = l.positions.filter(p => p.name.trim()).length;
                    const rows = l.positions.map((p, i) => posRow(p, i + 1)).join('');
                    return `<div class="card ${l.isCut ? 'cut' : ''}">
                        <div class="hd ${l.isCut ? 'cuthd' : ''}">
                            <div class="lt">Line ${esc(l.letter || '?')}${l.isCut ? ' (CUT)' : ''}</div>
                            <div class="ld">${esc(leads)}</div>
                            <div class="st">${fc} / ${l.needed} filled</div>
                        </div>
                        <div class="body">${rows}</div>
                    </div>`;
                };

                        <div class="hd waithd"><div class="lt">Roster</div><div class="st">${unassignedCount} unassigned</div></div>
                        <div class="body">${dailyRoster.filter(w => w.name.trim()).map((w, i) => `<div class="pos ${w.isNew ? 'new' : 'fill'}"><span class="n">${i + 1}</span><span class="nm">${esc(fmtName(w.name))}${w.isNew ? ' ★' : ''}</span></div>`).join('')}</div>
                    </div>` : '';

                const cardsHtml = lines.map(lineCard).join('') + waitCard;
                const indirectHtml = indirectNames.length ? `<div class="indirect"><div class="ihd">Indirect — Off-Floor (not counted in fill)</div><div class="irow">${indirectNames.map(i => `<span class="ichip">${esc(fmtName(i.name))}</span>`).join('')}</div></div>` : '';

                const html = `<!doctype html><html><head><meta charset="utf-8"><title>Staffing ${esc(currentDate)} ${esc(currentShift)}</title>
<style>
  @page { size: landscape; margin: 0.4in; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; color: #111827; }
  .title { text-align: center; font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .sub { text-align: center; font-size: 11px; color: #374151; margin-bottom: 8px; }
  .sub b { color: #059669; }
  .grid { font-size: 0; }
  /* Cards are kept compact so a full row of tall lines still fits under the
     header on the first page (inline-block rows paginate atomically — an

  .card { display: inline-block; vertical-align: top; width: 168px; margin: 0 4px 5px 0; border: 1px solid #333; border-radius: 4px; overflow: hidden; break-inside: avoid; page-break-inside: avoid; }
  .hd { background: #374151; color: #fff; padding: 2px 5px; text-align: center; }
  .hd.cuthd { background: #991b1b; }
  .hd.waithd { background: #92400e; }
  .lt { font-size: 12px; font-weight: 700; line-height: 1.15; }
  .ld { font-size: 8px; opacity: .95; line-height: 1.15; }
  .st { font-size: 8px; opacity: .95; }
  .body { padding: 2px; }
  .pos { display: flex; align-items: center; gap: 3px; border: 1px solid #d1d5db; border-radius: 2px; padding: 0 3px; margin-bottom: 1px; font-size: 10px; min-height: 15px; line-height: 1.25; }
  .pos .n { min-width: 13px; font-weight: 600; color: #6b7280; font-size: 8px; text-align: center; }

  .pos.fill { background: #ecfdf5; border-color: #10b981; }

  .card.cut { opacity: .75; border-color: #ef4444; }
  .indirect { margin-top: 6px; border: 1px solid #3730a3; border-radius: 4px; overflow: hidden; break-inside: avoid; }
  .ihd { background: #3730a3; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 6px; }
  .irow { padding: 4px 6px; }
  .ichip { display: inline-block; font-size: 11px; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 3px; padding: 2px 6px; margin: 2px 4px 2px 0; }
</style></head><body>
  <div class="title">Line Planner — ${esc(currentDate)} — ${esc(currentShift)} Shift</div>
  <div class="sub"><b>${filledPositions}</b> / ${totalPositions} filled${newAssociates ? ' • ' + newAssociates + ' new' : ''}${cutLines.length ? ' • ' + cutLines.length + ' cut' : ''}${unassignedCount ? ' • ' + unassignedCount + ' unassigned' : ''}</div>
  <div class="grid">${cardsHtml}</div>
  ${indirectHtml}
</body></html>`;

                const iframe = document.createElement('iframe');

            return (
                <div className="container">

                const today = new Date(currentDate);
                for (let i = 1; i <= 4; i++) {
                    const d = new Date(today);
                    d.setDate(today.getDate() - i);
                    const dateStr = d.toISOString().split('T')[0];
                    for (const shift of ['1st', '2nd', 'Swing']) {
                        try {
                            if (isFirebaseConfigured && db) {
                                const snap = await db.ref(`staffing/${dateStr}_${shift}`).once('value');
                                if (snap.exists()) {
                                    const data = snap.val();
                                    for (const line of (data.lines || [])) {
                                        for (const pos of (line.positions || [])) {
                                            if (pos.name && pos.name.trim().toLowerCase() === fullName.toLowerCase()) {
                                                return { date: dateStr, shift, line: line.letter, daysAgo: i };

                                    }

                                {scanResult.type === 'inactive' && (

                                        <div style={{ fontSize: '11px' }}>ID: {scanResult.employee.employeeId} · <strong>INACTIVE</strong> — not on active roster</div>
                                        {scanResult.alreadyStaffed && (

                                        <div style={{ marginBottom: '8px' }}>
                                            <input
                                                type="text"
                                                value={newHireName}
                                                onChange={(e) => setNewHireName(e.target.value)}
                                                placeholder="Enter full name..."

                                            <button

                                            Add to Roster

                                    </div>
                                )}
                            </div>

                        <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '16px' }}>
                            <button className="btn btn-secondary" onClick={onClose}>Close</button>

                    </div>
                </div>

        function StaffingView({

            setLines,

        }) {
            const [isQuickAddOpen, setIsQuickAddOpen] = useState(false);

            const [quickAddNames, setQuickAddNames] = useState([]); // [{name, lastLine, lastShift}]

            // Indirect (off-floor) slots — not counted toward fill/positions.
            const addIndirect = () => setIndirect(prev => [...(prev || []), { id: Date.now() + Math.random(), name: '' }]);
            const updateIndirect = (id, name) => setIndirect(prev => (prev || []).map(i => i.id === id ? { ...i, name } : i));
            const removeIndirect = (id) => setIndirect(prev => (prev || []).filter(i => i.id !== id));
            const [selectMode, setSelectMode] = useState(false);
            const [selectedPositions, setSelectedPositions] = useState([]);
            const [selectedRoster, setSelectedRoster] = useState([]);
            const [lastFirst, setLastFirst] = useState(() => storage.load('nameDisplayLastFirst', false));
            const [showBadgeScan, setShowBadgeScan] = useState(false);
            const quickAddInputRef = useRef(null);
            const [showEmailPrep, setShowEmailPrep] = useState(false);
            // "From roster" load option: pull the active associates whose
            // scheduled days include this date.
            const [ignoreSchedule, setIgnoreSchedule] = useState(false);

            // ===== Load today's roster (spreadsheet upload or pasted list) =====
            const [isLoadRosterOpen, setIsLoadRosterOpen] = useState(false);
            const [loadTab, setLoadTab] = useState('roster'); // 'roster' | 'upload' | 'paste'
            const [pasteText, setPasteText] = useState('');
            const [parsedEntries, setParsedEntries] = useState(null); // [{name, employeeId}]
            const [loadError, setLoadError] = useState('');
            const loadFileRef = useRef(null);

            const resetLoadRoster = () => {
                setIsLoadRosterOpen(false);
                setParsedEntries(null);
                setPasteText('');
                setLoadError('');
                setLoadTab('roster');
            };

            // Pull names (and employee IDs when present) out of an .xlsx/.csv file.
            const handleRosterFile = async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                e.target.value = '';
                setLoadError('');
                setParsedEntries(null);
                try {
                    const buf = await file.arrayBuffer();
                    const wb = XLSX.read(buf, { type: 'array' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
                    if (!rows.length) { setLoadError('No data rows found in that file.'); return; }

                    const headers = Object.keys(rows[0]);
                    const norm = (v) => v.toLowerCase().replace(/[\s_-]/g, '');
                    const findCol = (opts) => headers.find(h => opts.some(o => norm(h).includes(norm(o))));
                    // Split first/last columns win over a generic "name" column, because
                    // a header like "Last Name" also matches the loose 'name' lookup.
                    const firstCol = findCol(['firstname', 'fname', 'givenname']);
                    const lastCol  = findCol(['lastname', 'lname', 'surname']);
                    const useSplit = Boolean(firstCol && lastCol);
                    const fullNameCol = useSplit ? null : findCol(['fullname', 'associatename', 'employeename', 'associate', 'name']);
                    const idCol    = findCol(['employeeid', 'empid', 'employee#', 'employeenumber', 'badgeid', 'id']);

                    if (!fullNameCol && !useSplit) {
                        setLoadError(`Couldn't find a name column. Looked for "Full Name" or "First Name" + "Last Name". Found: ${headers.join(', ')}`);
                        return;
                    }

                    const seen = new Set();
                    const entries = [];
                    rows.forEach(row => {
                        let name = '';
                        if (fullNameCol) {
                            name = String(row[fullNameCol] || '').trim();
                            // "Last, First" -> "First Last"
                            if (name.includes(',')) {
                                const parts = name.split(',');
                                name = `${parts.slice(1).join(',').trim()} ${parts[0].trim()}`.trim();
                            }
                        } else {
                            name = `${String(row[firstCol] || '').trim()} ${String(row[lastCol] || '').trim()}`.trim();
                        }
                        if (!name) return;
                        const key = name.toLowerCase();
                        if (seen.has(key)) return;
                        seen.add(key);
                        entries.push({ name, employeeId: idCol ? String(row[idCol] || '').trim() : '' });
                    });

                    if (!entries.length) { setLoadError('No names found in that file.'); return; }
                    setParsedEntries(entries);
                } catch (err) {
                    setLoadError(`Could not read that file: ${err.message}`);
                }
            };

            // Parse a pasted list — one name per line. Tolerates "1. Name",
            // "Last, First", and trailing tab/comma-separated columns.
            const parsePastedNames = (text) => {
                const seen = new Set();
                const entries = [];
                (text || '').split(/\r?\n/).forEach(raw => {
                    let line = raw.trim();
                    if (!line) return;
                    line = line.replace(/^\d+[.)]\s*/, '');       // strip "1." / "1)"
                    if (line.includes('\t')) line = line.split('\t')[0].trim();
                    let name = line;
                    if (name.includes(',')) {
                        const parts = name.split(',');
                        // "Last, First" -> "First Last"; ignore any further columns
                        name = `${(parts[1] || '').trim()} ${parts[0].trim()}`.trim();
                    }
                    if (!name) return;
                    const key = name.toLowerCase();
                    if (seen.has(key)) return;
                    seen.add(key);
                    entries.push({ name, employeeId: '' });
                });
                return entries;
            };

            const handleParsePaste = () => {
                setLoadError('');
                const entries = parsePastedNames(pasteText);
                if (!entries.length) { setLoadError('No names found. Put one name per line.'); return; }
                setParsedEntries(entries);
            };

            const applyLoadedRoster = (mode) => {
                if (!parsedEntries || !parsedEntries.length) return;
                onLoadRoster(parsedEntries, mode);
                resetLoadRoster();
            };

            const toggleLastFirst = () => setLastFirst(v => {
                const nv = !v;
                storage.save('nameDisplayLastFirst', nv);
                return nv;
            });

            // Sort each line's names alphabetically by last name. Keeps blanks at the
            // bottom.
            const handleAlphabetize = () => {
                const sortFn = (a, b) => {
                    const an = (a.name || '').trim(), bn = (b.name || '').trim();
                    if (!an && !bn) return 0;
                    if (!an) return 1;
                    if (!bn) return -1;
                    return lastNameKey(an).localeCompare(lastNameKey(bn)) || an.localeCompare(bn);
                };
                setLines(prev => prev.map(line => ({
                    ...line,
                    positions: [...line.positions].sort(sortFn)
                })));
            };

            const handleQuickAddName = (nameOrAssoc) => {
                const name = typeof nameOrAssoc === 'string' ? nameOrAssoc : nameOrAssoc.fullName;
                const lastLine  = typeof nameOrAssoc === 'object' ? nameOrAssoc.lastLine  || null : null;
                const lastShift = typeof nameOrAssoc === 'object' ? nameOrAssoc.lastShift || null : null;
                setQuickAddNames(prev => [...prev, { name, lastLine, lastShift }]);
                setQuickAddInput('');
            };

            const handleRemoveQuickAddName = (index) => {
                setQuickAddNames(quickAddNames.filter((_, i) => i !== index));
            };

            const handleConfirmQuickAdd = () => {
                if (quickAddNames.length > 0) {
                    onQuickAddRoster(quickAddNames.map(n => n.name));
                }
                setIsQuickAddOpen(false);
                setQuickAddInput('');
                setQuickAddNames([]);
            };

            const handleCancelQuickAdd = () => {
                if (quickAddNames.length > 0) {
                    if (!confirm(`Discard ${quickAddNames.length} name(s)?`)) return;
                }
                setIsQuickAddOpen(false);
                setQuickAddInput('');
                setQuickAddNames([]);
            };

            if (lines.length === 0) {
                return (
                    <div className="empty-state">
                        <h3>No Shift Configured</h3>
                        <p>Go to "Setup" to create today's staffing chart.</p>
                    </div>
                );
            }

            // Calculate stats excluding cut lines
            const activeLines = lines.filter(line => !line.isCut);
            const cutLines = lines.filter(line => line.isCut);
            const totalPositions = activeLines.reduce((sum, line) => sum + line.needed, 0);
            const filledPositions = activeLines.reduce((sum, line) =>
                sum + line.positions.filter(p => p.name.trim()).length, 0
            );
            const newAssociates = activeLines.reduce((sum, line) =>
                sum + line.positions.filter(p => p.name.trim() && p.isNew).length, 0
            );

            // Duplicate person detection (bug #5)
            const allNames = [];
            lines.forEach(line => {
                if (!line.isCut) {
                    line.positions.forEach(p => {
                        if (p.name.trim()) allNames.push({ name: p.name.trim().toLowerCase(), location: `Line ${line.letter}` });
                    });
                }
            });
            dailyRoster.forEach(w => {
                if (w.name.trim()) allNames.push({ name: w.name.trim().toLowerCase(), location: 'Roster' });
            });
            const nameCounts = {};
            allNames.forEach(({ name, location }) => {
                if (!nameCounts[name]) nameCounts[name] = [];
                nameCounts[name].push(location);
            });
            const duplicates = Object.entries(nameCounts).filter(([_, locs]) => locs.length > 1);

            // Bulk operation handlers
            const togglePositionSelect = (lineId, positionId) => {
                setSelectedPositions(prev => {
                    const exists = prev.find(s => s.lineId === lineId && s.positionId === positionId);
                    if (exists) return prev.filter(s => !(s.lineId === lineId && s.positionId === positionId));
                    return [...prev, { lineId, positionId }];
                });

            const toggleRosterSelect = (id) => {
                setSelectedRoster(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            };

            const handleBulkMoveToRoster = () => {
                const toMove = [];
                selectedPositions.forEach(({ lineId, positionId }) => {
                    const line = lines.find(l => l.id === lineId);
                    if (line) {
                        const pos = line.positions.find(p => p.id === positionId);
                        if (pos && pos.name.trim()) {
                            toMove.push({ name: pos.name, isNew: pos.isNew });
                        }
                    }
                });
                if (toMove.length > 0) {
                    const newRosterItems = toMove.map(item => ({ id: Date.now() + Math.random(), name: item.name, isNew: item.isNew }));
                    setDailyRoster(prev => [...prev, ...newRosterItems]);
                    setLines(prev => prev.map(line => clearSelectedPositions(line)));
                }
                setSelectedPositions([]);
                setSelectedRoster([]);
            };

            // Clear the selected slots on a line, then sink the freed openings to
            // the bottom of the line.
            const clearSelectedPositions = (line) => {
                const isSelected = (pos) => selectedPositions.find(s => s.lineId === line.id && s.positionId === pos.id);
                if (!line.positions.some(isSelected)) return line;
                const positions = line.positions
                    .map(pos => isSelected(pos) ? { ...pos, name: '', isNew: false } : pos);
                return { ...line, positions: normalizeLinePositions(positions) };
            };

            const handleBulkClear = () => {
                setLines(prev => prev.map(line => clearSelectedPositions(line)));
                setDailyRoster(prev => prev.map(item => {
                    if (selectedRoster.includes(item.id)) {
                        return { ...item, name: '', isNew: false };
                    }
                    return item;
                }));
                setSelectedPositions([]);
                setSelectedRoster([]);
            };

            const handleDeselectAll = () => {
                setSelectedPositions([]);
                setSelectedRoster([]);
            };

            const filteredRoster = rosterSearch.trim()
                ? dailyRoster.filter(w => w.name.toLowerCase().includes(rosterSearch.toLowerCase()))
                : dailyRoster;

            return (
                <>
                    <div className="print-header">Line Planner - {currentDate} - {currentShift} Shift</div>

                    {!isFirebaseConfigured && (
                        <div className="firebase-config">
                            <h4>⚠️ Firebase Not Configured</h4>
                            <p>Data is being saved locally only. To enable cloud sync and remote access, please configure Firebase in the code.</p>
                        </div>
                    )}

                    {isLocked && (

                            <span>This staffing sheet is locked. Unlock to make changes.</span>

        function AutocompleteInput({ value, onChange, onSelect, onEnter, roster, placeholder, disabled, className, lastFirst }) {
            const [suggestions, setSuggestions] = useState([]);
            const [highlightedIdx, setHighlightedIdx] = useState(-1);
            const [open, setOpen] = useState(false);
            const [focused, setFocused] = useState(false);

            const buildSuggestions = (query) => {
                if (!query || query.length < 2 || !roster || Object.keys(roster).length === 0) return [];
                const lq = query.toLowerCase();
                return Object.values(roster)
                    .filter(r => r.isActive && r.fullName.toLowerCase().includes(lq))
                    .sort((a, b) => {
                        const als = a.fullName.toLowerCase().startsWith(lq);
                        const bls = b.fullName.toLowerCase().startsWith(lq);
                        if (als !== bls) return als ? -1 : 1;
                        return a.fullName.localeCompare(b.fullName);
                    })
                    .slice(0, 8);
            };

            const selectSuggestion = (assoc) => {
                onChange(assoc.fullName);
                setSuggestions([]);
                setOpen(false);
                setHighlightedIdx(-1);
                if (onSelect) onSelect(assoc);
            };

            return (
                <div className="autocomplete-wrapper">
                    <input
                        type="text"
                        className={className}
                        value={(lastFirst && !focused) ? formatLastFirst(value) : value}
                        placeholder={placeholder}
                        disabled={disabled}
                        onChange={(e) => {
                            onChange(e.target.value);
                            const s = buildSuggestions(e.target.value);
                            setSuggestions(s);
                            setOpen(s.length > 0);
                            setHighlightedIdx(-1);
                        }}
                        onKeyDown={(e) => {
                            if (e.key === 'ArrowDown' && open) { e.preventDefault(); setHighlightedIdx(i => Math.min(i + 1, suggestions.length - 1)); return; }
                            if (e.key === 'ArrowUp'   && open) { e.preventDefault(); setHighlightedIdx(i => Math.max(i - 1, 0)); return; }
                            if (e.key === 'Tab' && open && suggestions.length > 0) {
                                const target = highlightedIdx >= 0 ? suggestions[highlightedIdx] : suggestions[0];
                                if (target) { e.preventDefault(); selectSuggestion(target); return; }
                            }
                            if (e.key === 'Enter') {
                                if (open && highlightedIdx >= 0) { e.preventDefault(); selectSuggestion(suggestions[highlightedIdx]); return; }
                                if (onEnter && value.trim()) { e.preventDefault(); onEnter(value.trim()); return; }
                            }
                            if (e.key === 'Escape') { setOpen(false); setHighlightedIdx(-1); }
                        }}
                        onBlur={() => { setFocused(false); setTimeout(() => setOpen(false), 150); }}
                        onFocus={() => {
                            setFocused(true);
                            if (value && value.length >= 2) {
                                const s = buildSuggestions(value);
                                setSuggestions(s);
                                setOpen(s.length > 0);
                            }
                        }}
                    />
                    {open && suggestions.length > 0 && (
                        <div className="autocomplete-dropdown">
                            {suggestions.map((a, i) => (
                                <div
                                    key={a.employeeId}
                                    className={`autocomplete-item${i === highlightedIdx ? ' highlighted' : ''}`}
                                    onMouseDown={(e) => e.preventDefault()}
                                    onClick={() => selectSuggestion(a)}
                                    onMouseEnter={() => setHighlightedIdx(i)}
                                    style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px' }}
                                >
                                    <span>{a.fullName}</span>
                                    {a.lastLine && (
                                        <span style={{ fontSize: '10px', padding: '1px 6px', borderRadius: '8px', background: '#667eea', color: 'white', fontWeight: '600', flexShrink: 0 }}>
                                            Line {a.lastLine}
                                        </span>
                                    )}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function LineColumn({ line, isLocked, coreAssociates, roster, selectMode, selectedPositions, onTogglePositionSelect, onUpdatePosition, onUpdateLine, onRemoveLine, onToggleCutLine, onDragStart, onDragOver, onDrop, statusNameIndex, workHistoryIndex, lastFirst }) {
            const [isEditing, setIsEditing] = useState(false);
            const [editLetter, setEditLetter] = useState(line.letter);
            const [editLeads, setEditLeads] = useState((line.leads || []).join(', '));
            const [editNeeded, setEditNeeded] = useState(line.needed);

            const filledCount = line.positions.filter(p => p.name.trim()).length;
            const leads = line.leads || (line.lead ? [line.lead] : []);

            const handleSaveEdit = () => {
                const newLeadsArray = editLeads.split(',').map(l => l.trim()).filter(l => l);
                const oldLeadsArray = line.leads || [];
                const newNeeded = parseInt(editNeeded) || line.needed;

                // Find added and removed leads
                const addedLeads = newLeadsArray.filter(l => !oldLeadsArray.includes(l));
                const removedLeads = oldLeadsArray.filter(l => !newLeadsArray.includes(l));

                // Collect core members to add from new leads
                const coreToAdd = [];
                const ca = coreAssociates || {};
                addedLeads.forEach(lead => {
                    let members = ca[lead];
                    if (!members) {
                        const matchKey = Object.keys(ca).find(k => k.toLowerCase() === lead.toLowerCase());
                        members = matchKey ? ca[matchKey] : [];
                    }
                    members.forEach(m => {
                        // Don't add if already on this line
                        if (!line.positions.some(p => p.name.trim().toLowerCase() === m.name.trim().toLowerCase())) {
                            coreToAdd.push(m.name);
                        }
                    });
                });

                // Collect core member names from removed leads
                const coreToRemove = [];
                removedLeads.forEach(lead => {
                    let members = ca[lead];
                    if (!members) {
                        const matchKey = Object.keys(ca).find(k => k.toLowerCase() === lead.toLowerCase());
                        members = matchKey ? ca[matchKey] : [];
                    }
                    members.forEach(m => {
                        // Only remove if they're actually on this line
                        if (line.positions.some(p => p.name.trim().toLowerCase() === m.name.trim().toLowerCase())) {
                            coreToRemove.push(m.name.toLowerCase());
                        }
                    });
                });

                // Handle removed leads' core members
                let updatedPositions = [...line.positions];
                if (coreToRemove.length > 0) {
                    const shouldRemove = confirm(
                        `The following core members belong to removed lead(s):\n${coreToRemove.map(n => '  - ' + n).join('\n')}\n\nRemove them from this line?`
                    );
                    if (shouldRemove) {
                        updatedPositions = updatedPositions.map(p =>
                            coreToRemove.includes(p.name.trim().toLowerCase())
                                ? { ...p, name: '', isNew: false }
                                : p
                        );
                    }
                }

                let regularPositions = updatedPositions;
                const adjustedNeeded = Math.max(0, newNeeded);

                // Handle added leads' core members - fill empty slots
                if (coreToAdd.length > 0) {
                    let addIndex = 0;
                    let totalNeeded = adjustedNeeded;
                    const currentFilled = regularPositions.filter(p => p.name.trim()).length;
                    const emptySlots = regularPositions.filter(p => !p.name.trim()).length;

                    if (coreToAdd.length > emptySlots) {
                        totalNeeded = Math.max(adjustedNeeded, currentFilled + coreToAdd.length);
                    }

                    regularPositions = regularPositions.map(p => {
                        if (!p.name.trim() && addIndex < coreToAdd.length) {
                            const name = coreToAdd[addIndex];
                            addIndex++;
                            return { ...p, name, isNew: false };
                        }
                        return p;
                    });

                    while (addIndex < coreToAdd.length) {
                        regularPositions.push({
                            id: Date.now() + Math.random() + addIndex,
                            name: coreToAdd[addIndex],
                            isNew: false
                        });
                        addIndex++;
                        totalNeeded = Math.max(totalNeeded, regularPositions.length);
                    }

                    if (totalNeeded > adjustedNeeded) {
                        onUpdateLine(line.id, {
                            letter: editLetter,
                            leads: newLeadsArray,
                            needed: totalNeeded,
                            positions: regularPositions
                        });
                        setEditNeeded(totalNeeded);
                        setIsEditing(false);
                        return;
                    }
                }

                // Adjust the positions array for needed count changes
                if (adjustedNeeded > regularPositions.length) {
                    const additionalPositions = Array(adjustedNeeded - regularPositions.length)
                        .fill(null)
                        .map((_, idx) => ({
                            id: Date.now() + Math.random() + idx,
                            name: '',
                            isNew: false
                        }));
                    regularPositions = [...regularPositions, ...additionalPositions];
                } else if (adjustedNeeded < regularPositions.length) {
                    const wouldLose = regularPositions.slice(adjustedNeeded).filter(p => p.name.trim());
                    if (wouldLose.length > 0) {
                        const names = wouldLose.map(p => p.name).join(', ');
                        if (!confirm(`Reducing positions will remove: ${names}\n\nContinue?`)) {
                            setIsEditing(false);
                            return;
                        }
                    }
                    regularPositions = regularPositions.slice(0, adjustedNeeded);
                }

                onUpdateLine(line.id, {
                    letter: editLetter,
                    leads: newLeadsArray,
                    needed: adjustedNeeded,
                    positions: regularPositions
                });
                setEditNeeded(adjustedNeeded);
                setIsEditing(false);
            };

            const handleCancelEdit = () => {
                setEditLetter(line.letter);
                setEditLeads((line.leads || []).join(', '));
                setEditNeeded(line.needed);
                setIsEditing(false);
            };

            return (
                <div className={`line-column ${line.isCut ? 'cut' : ''}`} style={{ position: 'relative' }}>
                    {line.isCut && <div className="cut-badge">CUT</div>}
                    <div className="line-header">
                        {!isEditing ? (
                            <>
                                <div className="line-letter">Line {line.letter || '?'}</div>
                                <div className="line-lead">
                                    {leads.length > 0 ? leads.join(', ') : 'No lead'}
                                </div>
                                <div className="line-stats">
                                    {filledCount} / {line.needed} filled
                                </div>
                                <div className="line-edit-controls">
                                    <button
                                        className="btn btn-secondary btn-small"
                                        onClick={() => onToggleCutLine(line.id)}
                                        disabled={isLocked}
                                        style={{ fontSize: '10px', padding: '3px 6px', background: line.isCut ? '#10b981' : '#ef4444', color: 'white', border: 'none', opacity: isLocked ? 0.5 : 1 }}
                                    >
                                        {line.isCut ? 'Restore' : 'Cut'}
                                    </button>
                                    <button
                                        className="btn btn-secondary btn-small"
                                        onClick={() => setIsEditing(true)}
                                        disabled={isLocked}
                                        style={{ fontSize: '10px', padding: '3px 6px', opacity: isLocked ? 0.5 : 1 }}
                                    >
                                        Edit
                                    </button>
                                    <button
                                        className="btn btn-danger btn-small"
                                        onClick={() => onRemoveLine(line.id)}
                                        disabled={isLocked}
                                        style={{ fontSize: '10px', padding: '3px 6px', opacity: isLocked ? 0.5 : 1 }}
                                    >
                                        Remove
                                    </button>
                                </div>
                            </>
                        ) : (
                            <>
                                <div style={{ fontSize: '10px', marginBottom: '4px', opacity: 0.9 }}>Edit Line</div>
                                <input
                                    type="text"
                                    className="line-edit-input"
                                    value={editLetter}
                                    onChange={(e) => setEditLetter(e.target.value.toUpperCase())}
                                    placeholder="Letter (A, B, C...)"
                                    maxLength="2"
                                />
                                <input
                                    type="text"
                                    className="line-edit-input"
                                    value={editLeads}
                                    onChange={(e) => setEditLeads(e.target.value)}
                                    placeholder="Leads (comma-separated)"
                                />
                                <input
                                    type="number"
                                    className="line-edit-input"
                                    value={editNeeded}
                                    onChange={(e) => setEditNeeded(e.target.value)}
                                    placeholder="Quantity"
                                    min="1"
                                />
                                <div className="line-edit-controls">
                                    <button
                                        className="btn btn-success btn-small"
                                        onClick={handleSaveEdit}
                                        style={{ fontSize: '10px', padding: '3px 6px' }}
                                    >
                                        Save
                                    </button>
                                    <button
                                        className="btn btn-secondary btn-small"
                                        onClick={handleCancelEdit}
                                        style={{ fontSize: '10px', padding: '3px 6px' }}
                                    >
                                        Cancel
                                    </button>
                                </div>
                            </>
                        )}
                    </div>
                    <div className="positions-list">
                        {line.positions.map((position, index) => {
                            const posStatus = lookupNameStatus(statusNameIndex, position.name);

                            return (
                                <React.Fragment key={position.id}>
                                    <div
                                        className={`position-slot ${position.name.trim() ? 'filled' : ''} ${position.isNew ? 'new-associate' : ''}`}
                                        draggable={!isLocked && !selectMode && position.name.trim() !== '' && !line.isCut}
                                        onDragStart={(e) => (isLocked || selectMode) ? e.preventDefault() : onDragStart(e, { type: 'position', lineId: line.id, positionId: position.id })}
                                        onDragOver={selectMode ? null : onDragOver}
                                        onDrop={(e) => (isLocked || selectMode) ? e.preventDefault() : onDrop(e, { type: 'position', lineId: line.id, positionId: position.id })}
                                        style={{ cursor: isLocked ? 'not-allowed' : selectMode ? 'pointer' : (position.name.trim() && !line.isCut ? 'grab' : 'default'), position: 'relative' }}
                                        onClick={selectMode && position.name.trim() ? () => onTogglePositionSelect(line.id, position.id) : undefined}
                                    >
                                        {selectMode && position.name.trim() && (
                                            <input type="checkbox" className="bulk-checkbox"
                                                checked={!!(selectedPositions || []).find(s => s.lineId === line.id && s.positionId === position.id)}
                                                onChange={() => onTogglePositionSelect(line.id, position.id)}
                                                onClick={(e) => e.stopPropagation()}
                                                style={{ width: '14px', height: '14px' }}
                                            />
                                        )}
                                        <div className="position-number">
                                            {index + 1}
                                        </div>
                                        <div className="position-main">
                                            <AutocompleteInput
                                                className="position-input"
                                                value={position.name}
                                                onChange={(val) => onUpdatePosition(line.id, position.id, val, position.isNew)}
                                                roster={roster}
                                                lastFirst={lastFirst}
                                                placeholder="Name..."
                                                disabled={line.isCut || isLocked}
                                            />
                                        </div>
                                        {posStatus && posStatus.status && (
                                            <span className={`status-pill ${posStatus.status.className}`} title={posStatus.status.label}>{posStatus.status.shortLabel}</span>
                                        )}
                                        <div className="position-checkbox">
                                            <input
                                                type="checkbox"
                                                checked={position.isNew}
                                                onChange={(e) => onUpdatePosition(line.id, position.id, position.name, e.target.checked)}
                                                disabled={line.isCut || isLocked}
                                            />
                                        </div>
                                    </div>
                                </React.Fragment>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function SetupView({ onSetupShift, coreAssociates, initialDate, initialShift, supervisorShift, onSaveSupervisorShift }) {
            const [date, setDate] = useState(initialDate);
            const [shift, setShift] = useState(initialShift);
            const [lines, setLines] = useState([{ letter: '', leads: [], leadInput: '', needed: '' }]);
            const [showClone, setShowClone] = useState(false);
            const [cloneOptions, setCloneOptions] = useState([]);
            const [editingSupervisorShift, setEditingSupervisorShift] = useState(false);
            const [supervisorShiftDraft, setSupervisorShiftDraft] = useState(supervisorShift || '1st');

            const loadCloneOptions = async () => {
                const options = [];
                if (isFirebaseConfigured && db) {
                    try {
                        const snapshot = await db.ref('staffing').once('value');
                        if (snapshot.exists()) {
                            Object.entries(snapshot.val()).forEach(([id, data]) => {
                                options.push({ id, date: data.date, shift: data.shift, lines: data.lines || [] });
                            });
                        }
                    } catch (e) { console.error('Error loading clone options:', e); }
                }
                const localKeys = Object.keys(localStorage).filter(k => k.startsWith('staffing_') && !k.includes('coreAssociates'));
                localKeys.forEach(key => {
                    const data = storage.load(key);
                    if (data && !options.find(o => o.id === `${data.date}_${data.shift}`)) {
                        options.push({ id: `${data.date}_${data.shift}`, date: data.date, shift: data.shift, lines: data.lines || [] });
                    }
                });
                options.sort((a, b) => b.date.localeCompare(a.date));
                setCloneOptions(options);
                setShowClone(true);
            };

            const handleClone = (option) => {
                const clonedLines = option.lines.filter(l => !l.isCut).map(l => ({
                    letter: l.letter || '',
                    leads: l.leads || [],
                    leadInput: '',
                    needed: String(l.needed || '')
                }));
                if (clonedLines.length > 0) {
                    setLines(clonedLines);
                }
                setShowClone(false);
            };

            const handleAddLine = () => {
                setLines([...lines, { letter: '', leads: [], leadInput: '', needed: '' }]);
            };

            const handleRemoveLine = (index) => {
                setLines(lines.filter((_, i) => i !== index));
            };

            const handleLineChange = (index, field, value) => {
                const newLines = [...lines];
                newLines[index][field] = value;
                setLines(newLines);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                // Warn if selected shift doesn't match the configured supervisor shift
                if (supervisorShift && shift !== supervisorShift) {
                    const confirmed = confirm(
                        `WARNING: Shift mismatch!\n\n` +
                        `Your assigned shift is: ${supervisorShift}\n` +
                        `You are about to create a sheet for: ${shift} Shift\n\n` +
                        `Creating a sheet for the wrong shift will overwrite that shift's data.\n\n` +
                        `Are you sure you want to create a ${shift} Shift sheet?`
                    );
                    if (!confirmed) return;
                    // Second confirmation to prevent accidental click-through
                    const doubleConfirmed = confirm(
                        `Please confirm again: you are intentionally creating a ${shift} Shift sheet (not your assigned ${supervisorShift} Shift).`
                    );
                    if (!doubleConfirmed) return;
                }

                // Check if staffing sheet already exists for this date/shift
                const docId = `${date}_${shift}`;
                let existsInFirebase = false;
                let existsInLocalStorage = false;

                // Check Firebase
                if (isFirebaseConfigured && db) {
                    try {
                        const snapshot = await db.ref('staffing/' + docId).once('value');
                        existsInFirebase = snapshot.exists();
                    } catch (error) {
                        console.error('Error checking Firebase:', error);
                    }
                }

                // Check localStorage
                const localData = storage.load(`staffing_${date}_${shift}`, null);
                existsInLocalStorage = localData !== null;

                // If exists, prevent creating a new one
                if (existsInFirebase || existsInLocalStorage) {
                    const location = existsInFirebase ? 'cloud' : 'local storage';
                    const confirmed = confirm(
                        `A staffing sheet already exists for ${date} - ${shift} Shift (saved in ${location}).\n\n` +
                        `Only one staffing sheet can exist per date and shift to prevent data conflicts.\n\n` +
                        `Would you like to load the existing sheet instead?`
                    );

                    if (confirmed) {
                        // Load the existing sheet instead
                        onSetupShift({ date, shift, loadExisting: true });
                    }
                    return; // Don't create a new sheet
                }

                const validLines = lines.filter(l => l.letter && l.leads.length > 0 && l.needed).map(l => ({
                    ...l,
                    leads: l.leads
                }));
                if (validLines.length > 0) {
                    onSetupShift({ date, shift, lines: validLines });
                } else {
                    alert('Please fill in all fields for at least one line.');
                }
            };

            const allLeads = Object.keys(coreAssociates);

            return (
                <form onSubmit={handleSubmit} className="setup-form">
                    <div className="form-section">
                        <h3>Shift Information</h3>

                        {/* My Shift assignment banner */}
                        {!supervisorShift && !editingSupervisorShift ? (
                            <div className="shift-assignment-prompt">
                                <span>Tip: Set your assigned shift so you get a warning if you accidentally select the wrong one.</span>
                                <button type="button" className="btn btn-secondary btn-small"
                                    onClick={() => setEditingSupervisorShift(true)}
                                    style={{ marginLeft: '10px', whiteSpace: 'nowrap' }}>
                                    Set My Shift
                                </button>
                            </div>
                        ) : editingSupervisorShift ? (
                            <div className="shift-assignment-banner" style={{ background: '#eff6ff', borderColor: '#3b82f6' }}>
                                <span style={{ fontWeight: '600', marginRight: '8px' }}>My Assigned Shift:</span>
                                <select value={supervisorShiftDraft} onChange={(e) => setSupervisorShiftDraft(e.target.value)}
                                    style={{ marginRight: '8px', padding: '2px 6px', borderRadius: '4px', border: '1px solid #d1d5db' }}>
                                    <option>1st</option>
                                    <option>2nd</option>
                                    <option>Swing</option>
                                </select>
                                <button type="button" className="btn btn-secondary btn-small"
                                    onClick={() => { onSaveSupervisorShift(supervisorShiftDraft); setEditingSupervisorShift(false); }}
                                    style={{ background: '#10b981', color: 'white', border: 'none', marginRight: '6px' }}>
                                    Save
                                </button>
                                <button type="button" className="btn btn-secondary btn-small"
                                    onClick={() => setEditingSupervisorShift(false)}>
                                    Cancel
                                </button>
                            </div>
                        ) : (
                            <div className="shift-assignment-banner">
                                <span>My Assigned Shift: <strong>{supervisorShift}</strong></span>
                                <button type="button" className="btn btn-secondary btn-small"
                                    onClick={() => { setSupervisorShiftDraft(supervisorShift); setEditingSupervisorShift(true); }}
                                    style={{ marginLeft: '10px' }}>
                                    Change
                                </button>
                            </div>
                        )}

                        {/* Mismatch warning */}
                        {supervisorShift && shift !== supervisorShift && (
                            <div className="shift-mismatch-warning">
                                <strong>Warning:</strong> You are configured as a <strong>{supervisorShift} Shift</strong> supervisor,
                                but <strong>{shift} Shift</strong> is selected. Creating this sheet will modify {shift} Shift data.
                            </div>
                        )}

                        <div className="form-grid">
                            <div className="form-group">
                                <label>Date *</label>
                                <input
                                    type="date"
                                    value={date}
                                    onChange={(e) => setDate(e.target.value)}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>Shift *</label>
                                <select value={shift} onChange={(e) => setShift(e.target.value)} required
                                    style={supervisorShift && shift !== supervisorShift ? { borderColor: '#ef4444', boxShadow: '0 0 0 2px rgba(239,68,68,0.2)' } : {}}>
                                    <option>1st</option>
                                    <option>2nd</option>
                                    <option>Swing</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div className="form-section">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                            <h3 style={{ margin: 0 }}>Configure Production Lines</h3>
                            <button type="button" className="btn btn-secondary btn-small" onClick={loadCloneOptions}
                                style={{ background: '#667eea', color: 'white', border: 'none' }}>
                                Clone Previous Shift
                            </button>
                        </div>
                        {showClone && (
                            <div style={{ background: '#f0f2f5', border: '1px solid #d1d5db', borderRadius: '6px', padding: '12px', marginBottom: '12px', maxHeight: '200px', overflowY: 'auto' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                                    <strong style={{ fontSize: '12px' }}>Select a shift to clone:</strong>
                                    <button type="button" className="btn btn-secondary btn-small" onClick={() => setShowClone(false)}>×</button>
                                </div>
                                {cloneOptions.length === 0 ? (
                                    <p style={{ fontSize: '12px', color: '#6b7280' }}>No previous shifts found.</p>
                                ) : cloneOptions.map(opt => (
                                    <div key={opt.id} onClick={() => handleClone(opt)}
                                        style={{ padding: '8px', background: 'white', borderRadius: '4px', marginBottom: '4px', cursor: 'pointer', fontSize: '12px', border: '1px solid #e5e7eb' }}>
                                        <strong>{opt.date}</strong> - {opt.shift} Shift ({opt.lines.filter(l => !l.isCut).length} lines)
                                    </div>
                                ))}
                            </div>
                        )}
                        {lines.map((line, index) => (
                            <div key={index} className="form-grid" style={{ marginBottom: '12px', padding: '12px', background: 'white', borderRadius: '6px' }}>
                                <div className="form-group">
                                    <label>Line Letter *</label>
                                    <input
                                        type="text"
                                        value={line.letter}
                                        onChange={(e) => handleLineChange(index, 'letter', e.target.value.toUpperCase())}
                                        placeholder="A, B, C..."
                                        required
                                        maxLength="2"
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Line Lead(s) *</label>
                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px', marginBottom: line.leads.length > 0 ? '6px' : '0' }}>
                                        {line.leads.map((lead, li) => (
                                            <span key={li} style={{ display: 'inline-flex', alignItems: 'center', gap: '4px', background: '#667eea', color: 'white', padding: '3px 8px', borderRadius: '4px', fontSize: '12px', fontWeight: '600' }}>
                                                {lead}
                                                <button type="button" onClick={() => {
                                                    const newLines = [...lines];
                                                    newLines[index] = { ...newLines[index], leads: newLines[index].leads.filter((_, i) => i !== li) };
                                                    setLines(newLines);
                                                }} style={{ background: 'none', border: 'none', color: 'white', cursor: 'pointer', fontWeight: 'bold', fontSize: '14px', lineHeight: '1', padding: '0 2px' }}>×</button>
                                            </span>
                                        ))}
                                    </div>
                                    <div style={{ display: 'flex', gap: '4px' }}>
                                        <input
                                            type="text"
                                            list={`leads-${index}`}
                                            value={line.leadInput || ''}
                                            onChange={(e) => {
                                                const val = e.target.value;
                                                // Auto-add if user selected from datalist (exact match to a known lead)
                                                if (allLeads.includes(val) && !line.leads.includes(val)) {
                                                    const newLines = [...lines];
                                                    newLines[index] = { ...newLines[index], leads: [...newLines[index].leads, val], leadInput: '' };
                                                    setLines(newLines);
                                                } else {
                                                    handleLineChange(index, 'leadInput', val);
                                                }
                                            }}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter') {
                                                    e.preventDefault();
                                                    const val = (line.leadInput || '').trim();
                                                    if (val && !line.leads.includes(val)) {
                                                        const newLines = [...lines];

        const parseStaffingXLSX = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const wb = XLSX.read(data, { type: 'array' });
                        const ws = wb.Sheets['Staffing'];
                        if (!ws) {
                            reject(new Error('Sheet "Staffing" not found. Please upload a file exported from this tool.'));
                            return;
                        }

                        // Use defval:'' so every cell in the range comes back as a string
                        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

                        // Row 1: "{date} - {shift} Shift"
                        const infoStr = (rows[1]?.[0] || '').toString();
                        const dateShiftMatch = infoStr.match(/^(\d{4}-\d{2}-\d{2})\s*-\s*(\w+)\s+Shift/);
                        if (!dateShiftMatch) {
                            reject(new Error(`Could not parse date/shift from: "${infoStr}"`));
                            return;
                        }
                        const date = dateShiftMatch[1];
                        const shift = dateShiftMatch[2];

                        // Row 4: "Line A", "", "Line B", "", ..., "ROSTER"
                        const headerRow = rows[4] || [];
                        const lineData = [];
                        let rosterColIndex = -1;

                        for (let c = 0; c < headerRow.length; c++) {
                            const header = (headerRow[c] || '').toString().trim();
                            if (header === 'ROSTER') {
                                rosterColIndex = c;
                                break;
                            }
                            if (header.startsWith('Line ')) {
                                const isCut = header.includes('(CUT)');
                                const letter = header.replace(/^Line\s+/, '').replace(/\s*\(CUT\)\s*$/, '').trim();
                                lineData.push({ colIndex: c, letter, isCut, leads: [], positions: [] });
                                c++; // skip the blank spacing column
                            }
                        }

                        if (rosterColIndex === -1) rosterColIndex = lineData.length * 2;

                        // Row 5: lead names (comma-separated per line)
                        const leadsRow = rows[5] || [];
                        lineData.forEach(line => {
                            const leadStr = (leadsRow[line.colIndex] || '').toString().trim();
                            line.leads = (leadStr && leadStr !== 'No lead')
                                ? leadStr.split(', ').map(s => s.trim()).filter(Boolean)
                                : [];
                        });

                        // Rows 6+: one row per position slot
                        const dailyRoster = [];
                        for (let r = 6; r < rows.length; r++) {
                            const row = rows[r] || [];
                            lineData.forEach(line => {
                                const cellVal = (row[line.colIndex] || '').toString().trim();
                                const isNew = cellVal.includes('⭐');
                                const name = cellVal.replace(/\s*⭐\s*/g, '').trim();
                                if (name) {
                                    line.positions.push({ id: Date.now() + Math.random(), name, isNew });
                                }
                            });
                            const wCell = (row[rosterColIndex] || '').toString().trim();
                            const wIsNew = wCell.includes('⭐');
                            const wName = wCell.replace(/\s*⭐\s*/g, '').trim();
                            if (wName) {
                                dailyRoster.push({ id: Date.now() + Math.random(), name: wName, isNew: wIsNew });
                            }
                        }

                        const lines = lineData.map(line => ({
                            id: Date.now() + Math.random(),
                            letter: line.letter,
                            leads: line.leads,
                            needed: Math.max(line.positions.length, 1),
                            isCut: line.isCut,
                            positions: line.positions
                        }));

                        resolve({ date, shift, lines, dailyRoster });
                    } catch (err) {
                        reject(new Error('Failed to parse file: ' + err.message));
                    }
                };
                reader.onerror = () => reject(new Error('Failed to read file'));
                reader.readAsArrayBuffer(file);
            });
        };

        const fmtDateTime = (iso) => {
            if (!iso) return '—';
            const d = new Date(iso);
            return isNaN(d) ? '—' : d.toLocaleString();
        };
        const fmtRelative = (iso) => {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d)) return '';
            const s = Math.floor((Date.now() - d.getTime()) / 1000);
            if (s < 60) return 'just now';
            const m = Math.floor(s / 60); if (m < 60) return `${m}m ago`;
            const h = Math.floor(m / 60); if (h < 24) return `${h}h ago`;
            const days = Math.floor(h / 24); if (days < 30) return `${days}d ago`;
            return d.toLocaleDateString();
        };

        function ReportingView({ onLoadShift }) {
            const [reports, setReports] = useState([]);
            const [loading, setLoading] = useState(false);
            const [searchDate, setSearchDate] = useState('');
            const [collapsedMonths, setCollapsedMonths] = useState({});
            const [showComparison, setShowComparison] = useState(false);
            const [compareIdA, setCompareIdA] = useState('');
            const [compareIdB, setCompareIdB] = useState('');
            useEffect(() => {
                loadReports();
            }, []);

            const loadReports = async () => {
                setLoading(true);
                const reportsList = [];
                const firebaseReportIds = new Set();

                // Load from Firebase if configured
                if (isFirebaseConfigured && db) {
                    try {
                        const snapshot = await db.ref('staffing').once('value');
                        if (snapshot.exists()) {
                            const staffingData = snapshot.val();
                            Object.keys(staffingData).forEach(docId => {
                                const data = staffingData[docId];
                                reportsList.push({ id: docId, ...data, syncedToCloud: true });
                                firebaseReportIds.add(docId);
                            });
                        }
                        console.log('Loaded from Firebase Realtime Database:', reportsList.length, 'reports');
                    } catch (error) {
                        console.error('Error loading Firebase reports:', error);
                        alert('Error loading from Firebase: ' + error.message);
                    }
                }

                // Also check localStorage
                const localKeys = Object.keys(localStorage)
                    .filter(key => key.startsWith('staffing_'))
                    .filter(key => !key.includes('coreAssociates'));

                localKeys.forEach(key => {
                    const data = storage.load(key);
                    if (!data || !data.date || !data.shift) return;
                    const reportId = `${data.date}_${data.shift}`;
                    if (!reportsList.find(r => r.id === reportId)) {
                        reportsList.push({ id: reportId, ...data, syncedToCloud: false });
                    }
                });

                // Sort by date and shift (client-side)
                reportsList.sort((a, b) => {
                    if (a.date !== b.date) return b.date.localeCompare(a.date);
                    return a.shift.localeCompare(b.shift);
                });

                console.log('Total reports loaded:', reportsList.length);
                setReports(reportsList);
                setLoading(false);
            };

            const handleDeleteReport = async (report, e) => {
                e.stopPropagation();
                if (!confirm(`Delete the report for ${report.date} - ${report.shift} Shift? This cannot be undone.`)) return;

                try {
                    // Delete from Firebase if synced
                    if (report.syncedToCloud && isFirebaseConfigured && db) {
                        await db.ref('staffing/' + report.id).remove();
                    }
                    // Delete from localStorage
                    storage.remove('staffing_' + report.id);
                    setReports(prev => prev.filter(r => r.id !== report.id));
                    logActivity('report_deleted', report.id);
                } catch (error) {
                    console.error('Error deleting report:', error);
                    alert('Error deleting report: ' + error.message);
                }
            };

            // Get current week boundaries (Sunday to Saturday)
            const getWeekBounds = () => {
                const now = new Date();
                const dayOfWeek = now.getDay();
                const startOfWeek = new Date(now);
                startOfWeek.setDate(now.getDate() - dayOfWeek);
                startOfWeek.setHours(0, 0, 0, 0);
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 6);
                endOfWeek.setHours(23, 59, 59, 999);
                return { start: startOfWeek, end: endOfWeek };
            };

            const getMonthKey = (dateStr) => {
                const d = new Date(dateStr + 'T00:00:00');
                return d.toLocaleString('default', { month: 'long', year: 'numeric' });
            };

            const toggleMonth = (monthKey) => {
                setCollapsedMonths(prev => ({ ...prev, [monthKey]: !prev[monthKey] }));
            };

            const renderReportItem = (report) => {
                const totalPositions = (report.lines || []).reduce((sum, line) => sum + line.needed, 0);
                const filledPositions = (report.lines || []).reduce((sum, line) =>
                    sum + line.positions.filter(p => p.name && p.name.trim()).length, 0
                );

                return (
                    <div
                        key={report.id}
                        className="report-item"
                        onClick={() => onLoadShift(report.date, report.shift)}
                        style={{ position: 'relative' }}
                    >
                        <button
                            onClick={(e) => handleDeleteReport(report, e)}
                            title="Delete report"
                            style={{
                                position: 'absolute',
                                top: '8px',
                                right: '8px',
                                background: 'transparent',
                                border: 'none',
                                cursor: 'pointer',
                                color: '#9ca3af',
                                fontSize: '14px',
                                padding: '2px 6px',
                                borderRadius: '4px',
                                lineHeight: 1,

                            onMouseEnter={e => e.currentTarget.style.color = '#ef4444'}
                            onMouseLeave={e => e.currentTarget.style.color = '#9ca3af'}
