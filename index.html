                        resolve({ people, inactiveNames, skipped, fileName: file.name });
                    } catch (err) {
                        reject(new Error(`Could not read that file: ${err.message}`));
                    }
                };
                reader.onerror = () => reject(new Error('Could not read that file.'));
                reader.readAsArrayBuffer(file);
            });
        };

        // Merge a parsed roster into the existing associate map. Existing records
        // are updated in place (never replaced wholesale), so app-only fields —
        // status, lastLine, profile notes — survive a re-upload. Repeated uploads
        // in a day are therefore safe.
        const mergeKorpackRoster = (currentRoster, parsed) => {
            const updated = { ...(currentRoster || {}) };
            // Existing records indexed by name so a row that gains a CRM number
            // later still lands on the same person.
            const byName = {};
            Object.entries(updated).forEach(([k, a]) => {
                const t = nameTokenKey(a.fullName || '');
                if (t) byName[t] = k;
            });

            let created = 0, changed = 0, deactivated = 0;
            const nowISO = new Date().toISOString();

            parsed.people.forEach(p => {
                const nameToken = nameTokenKey(p.fullName);
                const existingKey = updated[p.key] ? p.key : (byName[nameToken] || null);
                const prev = existingKey ? updated[existingKey] : null;
                const targetKey = existingKey || p.key;
                const sp = p.fullName.indexOf(' ');
                const next = {
                    ...(prev || {}),
                    employeeId: (prev && prev.employeeId) || targetKey,
                    fullName: p.fullName,
                    firstName: sp !== -1 ? p.fullName.slice(0, sp) : p.fullName,
                    lastName: sp !== -1 ? p.fullName.slice(sp + 1) : '',
                    crmNumber: p.crmNumber || (prev && prev.crmNumber) || '',
                    startDate: p.startDate || (prev && prev.startDate) || '',
                    phone: p.phone || (prev && prev.phone) || '',
                    background: p.background || (prev && prev.background) || '',
                    language: p.language || (prev && prev.language) || '',
                    last4: p.last4 || (prev && prev.last4) || '',
                    recruiter: p.recruiter || (prev && prev.recruiter) || '',
                    assigned: p.assigned || (prev && prev.assigned) || '',
                    notes: p.notes || (prev && prev.notes) || '',
                    scheduledDays: p.scheduledDays.length ? p.scheduledDays : ((prev && prev.scheduledDays) || []),
                    // New people default to active; an existing person keeps the
                    // status set in the app.
                    status: (prev && prev.status) || 'active',
                    source: 'korpack-roster'
                };
                next.isActive = next.status === 'active';
                // Compare on content only — a fresh `updatedAt` would make every
                // re-upload look like a change.
                const sameAsBefore = prev && JSON.stringify({ ...prev, updatedAt: null }) === JSON.stringify({ ...next, updatedAt: null });
                next.updatedAt = sameAsBefore ? prev.updatedAt : nowISO;
                if (!prev) { created += 1; next.createdAt = nowISO; }
                else if (!sameAsBefore) changed += 1;
                updated[targetKey] = next;
                if (nameToken) byName[nameToken] = targetKey;
            });

            // Exit sheets flip people inactive but never delete them.
            parsed.inactiveNames.forEach(({ name, sheet }) => {
                const t = nameTokenKey(name.replace(/[*†‡]+\s*$/, '').trim());
                const key = t ? byName[t] : null;
                if (!key || !updated[key]) return;
                if (updated[key].status === 'inactive') return;
                updated[key] = {
                    ...updated[key],
                    status: 'inactive',
                    isActive: false,
                    inactiveReason: sheet,
                    updatedAt: nowISO
                };
                deactivated += 1;
            });

            return { updated, created, changed, deactivated, total: parsed.people.length, skipped: (parsed.skipped || []).length };
        };

        // ---- Scorecard ----
        // Mirrors one week block of the Korpack scorecard: a day column per
        // working day, a TOTALS column, and the KPI panel down the left. Rows
        // the planner can derive (Required, Working, Variance, Daily Direct
        // People, Daily Fill %, and by default New Starts / Lines Cut /
        // Confirmed) fill themselves in; everything else is an editable field.
        const SCORECARD_DEFAULTS = {
            site: 'KORPACK',
            shiftLabel: '1st',
            workDays: [4, 5, 6, 0] // Thu, Fri, Sat, Sun
        };

        // id: storage key · label: as printed on the scorecard · derived: filled
        // from the planner · manualOverride: derived but editable.
        const SCORECARD_ROWS = [
            { id: 'forecasted', label: 'Forecasted', kind: 'manual' },
            { id: 'confirmed', label: 'Confirmed', kind: 'derived', overridable: true },
            { id: 'required', label: 'Required', kind: 'derived', overridable: true },
            { id: 'working', label: 'Working - Direct Only', kind: 'derived', overridable: true },
            { id: 'variance', label: 'Variance', kind: 'computed', signed: true },
            { id: 'dailyDirect', label: 'Daily Direct People', kind: 'computed' },
            { id: 'dailyFill', label: 'Daily Fill %', kind: 'computed', percent: true },
            { id: 'newStarts', label: 'New Starts', kind: 'derived', overridable: true },
            { id: 'sentHome', label: 'Sent Home', kind: 'manual' },
            { id: 'linesCut', label: 'Lines Cut', kind: 'derived', overridable: true },
            { id: 'secondDayReturns', label: '2nd Day Returns', kind: 'manual' },
            { id: 'surveysCompleted', label: 'Surveys Completed', kind: 'manual' },
            { id: 'earlyLeaves', label: 'Early Leaves', kind: 'manual' },
            { id: 'dnrs', label: 'DNRs', kind: 'manual' }
        ];

        const scorecardDayDates = (weekEndingISO, workDays) => {
            const days = (workDays && workDays.length ? workDays : SCORECARD_DEFAULTS.workDays);
            return weekDates(weekEndingISO).filter(iso => {
                const d = parseSheetDate(iso);
                return d && days.includes(d.getDay());
            });
        };

        // Confirmations recorded for a date, counted across the week's attendance
        // entries. This is the "how many said they'd come in" half of the
        // confirmed-vs-showed metric.
        const confirmedCountFor = (weekAttendance, isoDate) => {
            const entries = (weekAttendance && weekAttendance.entries) || {};
            let n = 0;
            Object.values(entries).forEach(entry => {
                const day = entry && entry.days && entry.days[isoDate];
                if (day && day.confirmed) n += 1;
            });
            return n;
        };

        // One day column. `overrides` and `manual` come from the saved scorecard.
        const buildScorecardDay = (isoDate, reports, weekAttendance, saved) => {
            const totals = dayTotalsFromReports(reports, isoDate);
            const overrides = (saved && saved.overrides && saved.overrides[isoDate]) || {};
            const manual = (saved && saved.manual && saved.manual[isoDate]) || {};
            const pick = (key, derivedValue) => {
                const o = overrides[key];
                return (o === undefined || o === null || o === '') ? derivedValue : Number(o);
            };
            const confirmed = confirmedCountFor(weekAttendance, isoDate);
            // A day with no staffing sheet and no confirmations stays blank rather
            // than reading as a zero — the same way the workbook leaves unworked
            // days empty so they don't drag the averages down.
            const hasAny = totals.hasData || confirmed > 0;
            const derived = hasAny ? {
                confirmed,
                required: totals.required,
                working: totals.working,
                newStarts: totals.newStarts,
                linesCut: totals.linesCut
            } : { confirmed: null, required: null, working: null, newStarts: null, linesCut: null };
            const values = {
                confirmed: pick('confirmed', derived.confirmed),
                required: pick('required', derived.required),
                working: pick('working', derived.working),
                newStarts: pick('newStarts', derived.newStarts),
                linesCut: pick('linesCut', derived.linesCut)
            };
            SCORECARD_ROWS.filter(r => r.kind === 'manual').forEach(r => {
                const v = manual[r.id];
                values[r.id] = (v === undefined || v === null || v === '') ? null : Number(v);
            });
            values.variance = (values.working === null || values.required === null) ? null : values.working - values.required;
            values.dailyDirect = values.working;
            values.dailyFill = values.required > 0 ? Math.min(1, values.working / values.required) : null;
            return { date: isoDate, hasData: totals.hasData, derived, overrides, values };
        };

        const buildScorecardWeek = (weekEndingISO, reports, weekAttendance, saved, settings) => {
            const cfg = { ...SCORECARD_DEFAULTS, ...(settings || {}) };
            const dates = scorecardDayDates(weekEndingISO, cfg.workDays);
            const days = dates.map(iso => buildScorecardDay(iso, reports, weekAttendance, saved));
            const sum = (key) => {
                const nums = days.map(d => d.values[key]).filter(v => v !== null && v !== undefined && !isNaN(v));
                return nums.length ? nums.reduce((a, b) => a + b, 0) : null;
            };
            const totals = {};
            SCORECARD_ROWS.forEach(r => { totals[r.id] = sum(r.id); });
            totals.variance = (totals.working === null || totals.required === null) ? null : totals.working - totals.required;
            totals.dailyDirect = totals.working;
            totals.dailyFill = totals.required ? Math.min(1, totals.working / totals.required) : null;

            const directValues = days.map(d => d.values.dailyDirect).filter(v => v !== null && !isNaN(v));
            const kpi = {
                avgDailyPc: directValues.length ? directValues.reduce((a, b) => a + b, 0) / directValues.length : null,
                overallFillRate: totals.confirmed ? Math.min(1, totals.working / totals.confirmed) : null,
                shiftFillPct: totals.required ? totals.working / totals.required : null
            };
            return { weekEnding: weekEndingISO, site: cfg.site, shiftLabel: cfg.shiftLabel, dates, days, totals, kpi };
        };

        const fillPctClass = (v) => {
            if (v === null || v === undefined || isNaN(v)) return '';
            if (v >= 0.99) return 'sc-good';
            if (v >= 0.95) return 'sc-warn';
            return 'sc-bad';
        };
        const fmtPct = (v) => (v === null || v === undefined || isNaN(v)) ? '' : `${(v * 100).toFixed(1)}%`;
        const fmtNum = (v, signed) => {
            if (v === null || v === undefined || v === '' || isNaN(v)) return '';
            const n = Math.round(v);
            return signed && n > 0 ? `+${n}` : String(n);
        };

        // ---- Email prep ----
        // Rebuilds the "Email HC Confirmation" table: one row per line with
        // ORDERED / FILLED / NOT FILLED / Comments, then the totals row.
        const EMAIL_DEFAULTS = {
            recipients: '',
            subjectTemplate: '{site} {day} {m}/{d} attendance',
            site: 'Korpack'
        };

        const buildEmailPrep = (lines, isoDate, settings, extras) => {
            const cfg = { ...EMAIL_DEFAULTS, ...(settings || {}) };
            const d = parseSheetDate(isoDate) || new Date();
            const rows = (lines || []).map(line => {
                const needed = Math.max(0, parseInt(line.needed) || 0);
                const filled = (line.positions || []).filter(p => (p.name || '').trim()).length;
                const label = /^line/i.test((line.letter || '').trim())
                    ? (line.letter || '').trim().toUpperCase()
                    : `LINE ${(line.letter || '').trim()}`;
                return {
                    id: line.id,
                    label,
                    description: line.description || '',
                    ordered: line.isCut ? 0 : needed,
                    filled: line.isCut ? 0 : filled,
                    notFilled: line.isCut ? 0 : Math.max(0, needed - filled),
                    isCut: !!line.isCut,
                    comment: line.isCut ? 'Line cut' : ''
                };
            });
            const totals = rows.reduce((acc, r) => ({
                ordered: acc.ordered + r.ordered,
                filled: acc.filled + r.filled,
                notFilled: acc.notFilled + r.notFilled
            }), { ordered: 0, filled: 0, notFilled: 0 });
            const subject = (cfg.subjectTemplate || EMAIL_DEFAULTS.subjectTemplate)
                .replace(/\{site\}/g, cfg.site || '')
                .replace(/\{day\}/g, DOW_LONG[d.getDay()].toLowerCase())
                .replace(/\{Day\}/g, DOW_LONG[d.getDay()])
                .replace(/\{m\}/g, String(d.getMonth() + 1))
                .replace(/\{d\}/g, String(d.getDate()))
                .replace(/\{date\}/g, isoDate);
            return { rows, totals, subject, recipients: cfg.recipients || '', extras: extras || {} };
        };

        const emailPrepText = (prep) => {
            const pad = (s, n) => (s + ' '.repeat(n)).slice(0, n);
            const lines = [];
            lines.push(`Total Headcount: ${prep.totals.filled}`);
            lines.push('');
            lines.push(`${pad('', 10)}${pad('', 30)}${pad('ORDERED', 9)}${pad('FILLED', 8)}${pad('NOT FILLED', 12)}Comments`);
            prep.rows.forEach(r => {
                lines.push(`${pad(r.label, 10)}${pad(r.description, 30)}${pad(String(r.ordered), 9)}${pad(String(r.filled), 8)}${pad(String(r.notFilled), 12)}${r.comment}`);
            });
            lines.push(`${pad('Total', 10)}${pad('', 30)}${pad(String(prep.totals.ordered), 9)}${pad(String(prep.totals.filled), 8)}${pad(String(prep.totals.notFilled), 12)}`);
            if (prep.extras && prep.extras.confirmed !== undefined) {
                lines.push('');
                lines.push(`Confirmed: ${prep.extras.confirmed} · Showed: ${prep.extras.showed}` +
                    (prep.extras.showRate !== null && prep.extras.showRate !== undefined ? ` (${fmtPct(prep.extras.showRate)} show rate)` : ''));
            }
            return lines.join('\n');
        };

        const emailPrepHtml = (prep) => {
            const esc = (s) => (s == null ? '' : s.toString()).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            const th = 'padding:4px 10px;border:1px solid #999;background:#e5e7eb;font-weight:700;text-align:left';
            const td = 'padding:4px 10px;border:1px solid #999';
            const rows = prep.rows.map(r => `<tr>
  <td style="${td}"><b>${esc(r.label)}</b></td>
  <td style="${td}">${esc(r.description)}</td>
  <td style="${td};text-align:center">${r.ordered}</td>
  <td style="${td};text-align:center">${r.filled}</td>
  <td style="${td};text-align:center">${r.notFilled}</td>
  <td style="${td}">${esc(r.comment)}</td>
</tr>`).join('\n');
            return `<p><b>Total Headcount: ${prep.totals.filled}</b></p>
<table style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:13px">
<tr><th style="${th}"></th><th style="${th}"></th><th style="${th}">ORDERED</th><th style="${th}">FILLED</th><th style="${th}">NOT FILLED</th><th style="${th}">Comments</th></tr>
${rows}
<tr><td style="${td}"><b>Total</b></td><td style="${td}"></td><td style="${td};text-align:center"><b>${prep.totals.ordered}</b></td><td style="${td};text-align:center"><b>${prep.totals.filled}</b></td><td style="${td};text-align:center"><b>${prep.totals.notFilled}</b></td><td style="${td}"></td></tr>
</table>`;
        };

        function App({ user }) {
            const [activeTab, setActiveTab] = useState('setup');
            const [currentDate, setCurrentDate] = useState(new Date().toISOString().split('T')[0]);
            const [currentShift, setCurrentShift] = useState('1st');
            const [lines, setLines] = useState([]);
            const [dailyRoster, setDailyRoster] = useState([]);
            const [indirect, setIndirect] = useState([]); // off-floor (sanitation/office/forklift); not counted
            const [coreAssociates, setCoreAssociates] = useState({});
            const [lineLeadNotes, setLineLeadNotes] = useState({});
            const [saveStatus, setSaveStatus] = useState('');
            const [firebaseStatus, setFirebaseStatus] = useState(isFirebaseConfigured ? 'connected' : 'offline');
            const [isLocked, setIsLocked] = useState(false);
            const [undoStack, setUndoStack] = useState([]);
            const [undoMessage, setUndoMessage] = useState('');
            const [supervisorShift, setSupervisorShift] = useState(() => storage.load('supervisorShift', ''));
            const [showShiftModal, setShowShiftModal] = useState(() => !storage.load('supervisorShift', ''));
            const [shiftModalDraft, setShiftModalDraft] = useState('1st');
            const importInputRef = useRef(null);
            const [importStatus, setImportStatus] = useState('');
            const [statusList, setStatusList] = useState({});
            const [statusMeta, setStatusMeta] = useState(null);
            const [workHistoryIndex, setWorkHistoryIndex] = useState({});
            const saveTimeoutRef = useRef(null);
            const savingRef = useRef(false);
            const undoTimerRef = useRef(null);
            const isLoadingRef = useRef(false);
            // Per-report creation metadata { [docId]: { createdBy, createdAt } } so the
            // original creator/created time survives autosaves (which set() the whole node).
            const reportMetaRef = useRef({});
            const [roster, setRoster] = useState({});
            // Saved staffing sheets, kept in state so Attendance and the
            // Scorecard can derive who was placed and how many spots were filled.
            const [staffingReports, setStaffingReports] = useState([]);
            // Weekly attendance, keyed by week-ending (Sunday) ISO date.
            const [attendance, setAttendance] = useState({});
            // Weekly scorecard input, keyed the same way.
            const [scorecards, setScorecards] = useState({});
            const [scorecardSettings, setScorecardSettings] = useState(() => ({ ...SCORECARD_DEFAULTS, ...storage.load('scorecardSettings', {}) }));
            const [emailSettings, setEmailSettings] = useState(() => ({ ...EMAIL_DEFAULTS, ...storage.load('emailSettings', {}) }));

            // Load roster from Firebase / localStorage
            useEffect(() => {
                const loadRoster = async () => {
                    if (isFirebaseConfigured && db) {
                        try {
                            const snap = await db.ref('roster/associates').once('value');
                            if (snap.exists()) { setRoster(snap.val()); return; }
                        } catch (e) { console.error('Error loading roster:', e); }
                    }
                    const saved = storage.load('roster', {});
                    setRoster(saved);
                };
                loadRoster();
            }, []);

            const handleSyncRoster = (updatedRoster) => {
                setRoster(updatedRoster);
            };

            const handleSignOut = async () => {
                if (!isAuthEnabled || !auth) return;
                try { await auth.signOut(); } catch (e) { console.error('Sign-out failed:', e); }
            };

            const handleUpdateAssociate = async (employeeId, fields) => {
                const updated = { ...roster, [employeeId]: { ...roster[employeeId], ...fields } };
                setRoster(updated);
                storage.save('roster', updated);
                if (isFirebaseConfigured && db) {
                    const patch = {};
                    Object.entries(fields).forEach(([k, v]) => { patch[`roster/associates/${employeeId}/${k}`] = v; });
                    try { await db.ref('/').update(patch); } catch (e) { console.error('Error updating associate:', e); }
                }
            };

            // ---- Attendance / scorecard / settings persistence ----
            // Both nodes are small (a handful of rows per week), so they load
            // whole and stay in state; writes are per-field patches so two
            // people editing different weeks don't clobber each other.
            useEffect(() => {
                const loadWeeklyData = async () => {
                    if (isFirebaseConfigured && db) {
                        try {
                            const [attSnap, scSnap, cfgSnap] = await Promise.all([
                                db.ref('attendance').once('value'),
                                db.ref('scorecard').once('value'),
                                db.ref('settings/planner').once('value')
                            ]);
                            if (attSnap.exists()) { setAttendance(attSnap.val() || {}); storage.save('attendance', attSnap.val() || {}); }
                            else setAttendance(storage.load('attendance', {}));
                            if (scSnap.exists()) { setScorecards(scSnap.val() || {}); storage.save('scorecards', scSnap.val() || {}); }
                            else setScorecards(storage.load('scorecards', {}));
                            if (cfgSnap.exists()) {
                                const cfg = cfgSnap.val() || {};
                                if (cfg.scorecard) { setScorecardSettings(s => ({ ...s, ...cfg.scorecard })); storage.save('scorecardSettings', cfg.scorecard); }
                                if (cfg.email) { setEmailSettings(s => ({ ...s, ...cfg.email })); storage.save('emailSettings', cfg.email); }
                            }
                            return;
                        } catch (e) {
                            console.error('Error loading attendance/scorecard:', e);
                        }
                    }
                    setAttendance(storage.load('attendance', {}));
                    setScorecards(storage.load('scorecards', {}));
                };
                loadWeeklyData();
            }, []);

            // Upsert the roster from an uploaded recruiting-roster workbook.
            // Safe to run repeatedly in a day: existing people are updated in
            // place and nobody is ever removed.
            const handleRosterUpload = async (file) => {
                const parsed = await parseKorpackRoster(file);
                const result = mergeKorpackRoster(roster, parsed);
                setRoster(result.updated);
                storage.save('roster', result.updated);
                const syncTime = new Date().toISOString();
                storage.save('rosterLastSync', syncTime);
                if (isFirebaseConfigured && db) {
                    try {
                        await db.ref('roster/associates').update(result.updated);
                        await db.ref('roster/lastSync').set(syncTime);
                    } catch (e) {
                        console.error('Error saving roster upload:', e);
                        throw new Error(`Parsed ${result.total} rows but the cloud save failed: ${e.message}`);
                    }
                }
                logActivity('roster_uploaded', `${parsed.fileName} (${result.created} new, ${result.changed} updated, ${result.deactivated} deactivated)`);
                return { ...result, fileName: parsed.fileName, syncTime };
            };

            // Status is the single switch that decides who reaches the staffing
            // roster. `isActive` is kept in step for the older screens that read it.
            const handleSetAssociateStatus = (employeeId, status) => {
                handleUpdateAssociate(employeeId, { status, isActive: status === 'active', updatedAt: new Date().toISOString() });
            };

            const persistAttendanceWeek = (weekEnding, week) => {
                setAttendance(prev => {
                    const next = { ...prev, [weekEnding]: week };
                    storage.save('attendance', next);
                    return next;
                });
                if (isFirebaseConfigured && db) {
                    db.ref(`attendance/${weekEnding}`).set(week)
                      .catch(e => console.error('Error saving attendance:', e));
                }
            };

            // Patch one associate's record for one day: status override, absence
            // reason, or the confirmation flag.
            const handleUpdateAttendanceDay = (weekEnding, assocKey, isoDate, patch) => {
                const week = attendance[weekEnding] || { weekEnding, entries: {} };
                const entry = (week.entries && week.entries[assocKey]) || { notes: '', days: {} };
                const day = { ...((entry.days || {})[isoDate] || {}), ...patch };
                // Clear empties so a blanked field doesn't linger as an override.
                Object.keys(day).forEach(k => { if (day[k] === '' || day[k] === false) delete day[k]; });
                const days = { ...(entry.days || {}) };
                if (Object.keys(day).length) days[isoDate] = day; else delete days[isoDate];
                persistAttendanceWeek(weekEnding, {
                    ...week,
                    weekEnding,
                    entries: { ...(week.entries || {}), [assocKey]: { ...entry, days } },
                    updatedAt: new Date().toISOString()
                });
            };

            const handleUpdateAttendanceNotes = (weekEnding, assocKey, notes) => {
                const week = attendance[weekEnding] || { weekEnding, entries: {} };
                const entry = (week.entries && week.entries[assocKey]) || { notes: '', days: {} };
                persistAttendanceWeek(weekEnding, {
                    ...week,
                    weekEnding,
                    entries: { ...(week.entries || {}), [assocKey]: { ...entry, notes } },
                    updatedAt: new Date().toISOString()
                });
            };

            // `patch` is { manual: {date: {...}}, overrides: {date: {...}} } — merged
            // per date so editing one cell doesn't drop the rest of the column.
            const handleUpdateScorecard = (weekEnding, isoDate, group, field, value) => {
                const card = scorecards[weekEnding] || { weekEnding, manual: {}, overrides: {} };
                const bucket = { ...((card[group] || {})[isoDate] || {}) };
                if (value === '' || value === null || value === undefined) delete bucket[field];
                else bucket[field] = Number(value);
                const nextCard = {
                    ...card,
                    weekEnding,
                    [group]: { ...(card[group] || {}), [isoDate]: bucket },
                    updatedAt: new Date().toISOString()
                };
                setScorecards(prev => {
                    const next = { ...prev, [weekEnding]: nextCard };
                    storage.save('scorecards', next);
                    return next;
                });
                if (isFirebaseConfigured && db) {
                    db.ref(`scorecard/${weekEnding}`).set(nextCard)
                      .catch(e => console.error('Error saving scorecard:', e));
                }
            };

            const handleSavePlannerSettings = (group, values) => {
                if (group === 'scorecard') { setScorecardSettings(values); storage.save('scorecardSettings', values); }
                else { setEmailSettings(values); storage.save('emailSettings', values); }
                if (isFirebaseConfigured && db) {
                    db.ref(`settings/planner/${group}`).set(values)
                      .catch(e => console.error('Error saving planner settings:', e));
                }
            };

            const placementIndex = React.useMemo(() => buildPlacementIndex(staffingReports), [staffingReports]);

            // Active associates scheduled for a given date, in the shape the
            // Roster panel's Load flow expects.
            const activeRosterFor = (isoDate, ignoreSchedule) => {
                return Object.entries(roster || {})
                    .filter(([, a]) => isAssociateActive(a) && (a.fullName || '').trim())
                    .filter(([, a]) => ignoreSchedule || !scheduledDowList(a).length || isScheduledOn(a, isoDate))
                    .map(([key, a]) => ({ name: a.fullName.trim(), employeeId: a.employeeId || key }))
                    .sort((a, b) => lastNameKey(a.name).localeCompare(lastNameKey(b.name)));
            };

            // Load core associates from Firebase and localStorage
            useEffect(() => {
                const loadCoreAssociates = async () => {
                    // Try Firebase first
                    if (isFirebaseConfigured && db) {
                        try {
                            const snapshot = await db.ref('settings/coreAssociates').once('value');
                            if (snapshot.exists()) {
                                const data = snapshot.val();
                                console.log('Loaded core associates from Firebase Realtime Database');
                                setCoreAssociates(data.associates || {});
                                setLineLeadNotes(data.notes || {});
                                return;
                            }
                        } catch (error) {
                            console.error('Error loading core associates from Firebase:', error);
                        }
                    }

                    // Fallback to localStorage
                    const savedCoreAssociates = storage.load('coreAssociates', {});
                    setCoreAssociates(savedCoreAssociates);
                    const savedNotes = storage.load('lineLeadNotes', {});
                    setLineLeadNotes(savedNotes);
                };
                loadCoreAssociates();
            }, []);

            // Save core associates and notes to both localStorage and Firebase
            useEffect(() => {
                storage.save('coreAssociates', coreAssociates);
                storage.save('lineLeadNotes', lineLeadNotes);

                // Also save to Firebase
                if (isFirebaseConfigured && db && Object.keys(coreAssociates).length > 0) {
                    db.ref('settings/coreAssociates').set({
                        associates: coreAssociates,
                        notes: lineLeadNotes,
                        lastUpdated: new Date().toISOString()
                    }).then(() => {
                        console.log('Core associates saved to Firebase Realtime Database');
                    }).catch(error => {
                        console.error('Error saving core associates to Firebase:', error);
                    });
                }
            }, [coreAssociates, lineLeadNotes]);

            // Load associate status (suspensions / DNR / early leaves). The canonical
            // source is the raw `statusRaw` node (written daily by the SharePoint sync
            // or by a manual upload); it's resolved into a status list client-side so
            // the precedence + return-date logic lives in one place. localStorage
            // caches the resolved list for offline use.
            useEffect(() => {
                const applyRaw = (rawVal, metaVal) => {
                    const { statusList: resolved, meta } = resolveStatusRaw(rawVal);
                    const effectiveMeta = metaVal || meta;
                    setStatusList(resolved);
                    setStatusMeta(effectiveMeta);
                    storage.save('statusList', resolved);
                    storage.save('statusMeta', effectiveMeta);
                };
                const loadStatus = async () => {
                    if (isFirebaseConfigured && db) {
                        try {
                            const [rawSnap, metaSnap] = await Promise.all([
                                db.ref('statusRaw').once('value'),
                                db.ref('statusMeta').once('value')
                            ]);
                            const metaVal = metaSnap.exists() ? metaSnap.val() : null;
                            if (rawSnap.exists()) {
                                applyRaw(rawSnap.val(), metaVal);
                                console.log('Loaded status from Firebase (statusRaw)');
                                return;
                            }
                            // Legacy: a pre-resolved statusList from an older build.
                            const listSnap = await db.ref('statusList').once('value');
                            if (listSnap.exists()) {
                                setStatusList(listSnap.val() || {});
                                setStatusMeta(metaVal);
                                storage.save('statusList', listSnap.val() || {});
                                storage.save('statusMeta', metaVal);
                                return;
                            }
                        } catch (error) {
                            console.error('Error loading status from Firebase:', error);
                        }
                    }
                    setStatusList(storage.load('statusList', {}));
                    setStatusMeta(storage.load('statusMeta', null));
                };
                loadStatus();
                // Keep in sync if the daily sync (or another device) updates Firebase.
                if (isFirebaseConfigured && db) {
                    const rawRef = db.ref('statusRaw');
                    const rawHandler = rawRef.on('value', (snap) => {
                        if (snap.exists()) {
                            const { statusList: resolved } = resolveStatusRaw(snap.val());
                            setStatusList(resolved);
                            storage.save('statusList', resolved);
                        }
                    });
                    const metaRef = db.ref('statusMeta');
                    const metaHandler = metaRef.on('value', (snap) => {
                        const v = snap.exists() ? snap.val() : null;
                        setStatusMeta(v);
                        storage.save('statusMeta', v);
                    });
                    return () => { rawRef.off('value', rawHandler); metaRef.off('value', metaHandler); };
                }
            }, []);

            const statusNameIndex = React.useMemo(() => buildStatusNameIndex(statusList), [statusList]);

            // Load saved staffing reports once to build the "last lead worked for" index.
            useEffect(() => {
                const loadHistory = async () => {
                    const reportsList = [];
                    const seen = new Set();
                    if (isFirebaseConfigured && db) {
                        try {
                            const snap = await db.ref('staffing').once('value');
                            if (snap.exists()) {
                                const data = snap.val();
                                Object.keys(data).forEach(id => { reportsList.push(data[id]); seen.add(id); });
                            }
                        } catch (e) { console.error('Error loading staffing history:', e); }
                    }
                    Object.keys(localStorage)
                        .filter(k => k.startsWith('staffing_') && !k.includes('coreAssociates'))
                        .forEach(k => {
                            const d = storage.load(k);
                            if (!d || !d.date) return;
                            const id = `${d.date}_${d.shift}`;
                            if (!seen.has(id)) { reportsList.push(d); seen.add(id); }
                        });
                    setStaffingReports(reportsList);
                    setWorkHistoryIndex(buildWorkHistoryIndex(reportsList));
                };
                loadHistory();
            }, []);

            // Auto-save functionality
            useEffect(() => {
                if (lines.length === 0) return;
                if (isLoadingRef.current) return;

                if (saveTimeoutRef.current) {
                    clearTimeout(saveTimeoutRef.current);
                }

                // Capture current values in closure to prevent stale data
                const capturedDate = currentDate;
                const capturedShift = currentShift;
                const capturedLines = lines;
                const capturedRoster = dailyRoster;
                const capturedIndirect = indirect;
                const capturedLocked = isLocked;

                saveTimeoutRef.current = setTimeout(() => {
                    handleAutoSave(capturedDate, capturedShift, capturedLines, capturedRoster, capturedLocked, capturedIndirect);
                }, 2000);

                return () => {
                    if (saveTimeoutRef.current) {
                        clearTimeout(saveTimeoutRef.current);
                    }
                };
            }, [lines, dailyRoster, indirect, currentDate, currentShift]);

            const handleAutoSave = async (date, shift, saveLines, saveRoster, locked, saveIndirect) => {
                if (savingRef.current) return;
                savingRef.current = true;

                const docId = `${date}_${shift}`;
                const now = new Date().toISOString();
                const actor = user ? { uid: user.uid, email: user.email || '' } : null;

                // Resolve creation metadata once per report/session, preserving whoever
                // originally created it (an autosave set() would otherwise wipe it).
                let meta = reportMetaRef.current[docId];
                let isNewReport = false;
                if (!meta) {
                    meta = { createdBy: null, createdAt: null };
                    if (isFirebaseConfigured && db) {
                        try {
                            const existing = await db.ref('staffing/' + docId).once('value');
                            if (existing.exists()) {
                                const ex = existing.val();
                                meta.createdBy = ex.createdBy || null;
                                meta.createdAt = ex.createdAt || null;
                            }
                        } catch (e) { /* fall through — treat as new */ }
                    }
                    if (!meta.createdAt) { isNewReport = true; meta.createdBy = actor; meta.createdAt = now; }
                    reportMetaRef.current[docId] = meta;
                }

                const staffingData = {
                    date: date,
                    shift: shift,
                    lines: saveLines,
                    dailyRoster: saveRoster,
                    indirect: saveIndirect || [],
                    locked: locked,
                    lastUpdated: now,
                    createdBy: meta.createdBy || null,
                    createdAt: meta.createdAt || now,
                    updatedBy: actor,
                    updatedAt: now
                };

                // Keep the in-memory report list current so Attendance and the
                // Scorecard reflect the sheet as it's being built, not just at load.
                setStaffingReports(prev => {
                    const rest = prev.filter(r => !(r.date === date && r.shift === shift));
                    return [...rest, staffingData];
                });

                // Save to Firebase first if configured
                if (isFirebaseConfigured && db) {
                    try {
                        await db.ref('staffing/' + docId).set(staffingData);
                        storage.save(`staffing_${date}_${shift}`, staffingData);
                        if (isNewReport) logActivity('report_created', docId);

                        // Update lastLine / lastShift for each assigned associate
                        const nameToId = {};
                        Object.values(roster).forEach(a => { if (a.fullName) nameToId[a.fullName.toLowerCase().trim()] = a.employeeId; });
                        const rosterUpdates = {};
                        saveLines.forEach(line => {
                            if (line.isCut) return;
                            (line.positions || []).forEach(pos => {
                                const name = (pos.name || '').trim();
                                if (!name) return;
                                const empId = nameToId[name.toLowerCase()];
                                if (!empId) return;
                                rosterUpdates[`roster/associates/${empId}/lastLine`] = line.letter;
                                rosterUpdates[`roster/associates/${empId}/lastShift`] = shift;
                            });
                        });
                        if (Object.keys(rosterUpdates).length > 0) {
                            db.ref('/').update(rosterUpdates).then(() => {
                                const updated = { ...roster };
                                Object.entries(rosterUpdates).forEach(([path, val]) => {
                                    const parts = path.split('/'); // roster/associates/<id>/field
                                    const empId = parts[2], field = parts[3];
                                    if (updated[empId]) updated[empId] = { ...updated[empId], [field]: val };
                                });
                                setRoster(updated);
                                storage.save('roster', updated);
                            }).catch(e => console.error('Error updating lastLine/lastShift:', e));
                        }

                        setSaveStatus('Saved to cloud ✓');
                        setFirebaseStatus('connected');
                        setTimeout(() => setSaveStatus(''), 3000);
                    } catch (error) {
                        console.error('Firebase save error:', error);
                        setFirebaseStatus('disconnected');
                        // Still save locally as fallback
                        storage.save(`staffing_${date}_${shift}`, staffingData);
                        setSaveStatus('Error: Cloud save failed - saved locally only');
                        // Don't auto-clear errors
                    }
                } else {
                    storage.save(`staffing_${date}_${shift}`, staffingData);
                    setSaveStatus('Saved locally');
                    setTimeout(() => setSaveStatus(''), 3000);
                }

                savingRef.current = false;
            };

            const loadStaffingData = async (date, shift) => {
                console.log('Loading staffing data for:', date, shift);

                    if (isFirebaseConfigured && db) {

                            const snapshot = await db.ref('staffing/' + docId).once('value');
                            if (snapshot.exists()) {
                                const data = snapshot.val();
                                console.log('Loaded from Firebase Realtime Database:', docId, data);
                                // Cache creator so a later autosave preserves it (and doesn't
                                // mislabel this edit as a new report in the activity log).
                                reportMetaRef.current[docId] = {
                                    createdBy: data.createdBy || null,
                                    createdAt: data.createdAt || null
                                };
                                isLoadingRef.current = false;
                                setLines(data.lines || []);
                                setDailyRoster(data.dailyRoster || []);
                                setIndirect(data.indirect && data.indirect.length ? data.indirect : makeIndirectSlots(3));
                                setIsLocked(data.locked || false);
                                return;
                            } else {
                                console.log('Document not found in Firebase:', docId);
                            }

                    }

                    // Fallback to localStorage
                    const localData = storage.load(`staffing_${date}_${shift}`, null);

                    if (localData) {
                        console.log('Loaded from localStorage:', localData);
                        setLines(localData.lines || []);
                        setDailyRoster(localData.dailyRoster || []);
                        setIndirect(localData.indirect && localData.indirect.length ? localData.indirect : makeIndirectSlots(3));
                        setIsLocked(localData.locked || false);
                    } else {
                        console.log('No data found');
                        setLines([]);
                        setDailyRoster([]);
                        setIndirect(makeIndirectSlots(3));
                        setIsLocked(false);
                    }
                } catch (error) {
                    console.error('Unexpected load error:', error);
                    isLoadingRef.current = false;
                }
            };

            const handleSaveSupervisorShift = (shift) => {
                setSupervisorShift(shift);
                storage.save('supervisorShift', shift);
            };

            const handleImportClick = () => {
                importInputRef.current?.click();
            };

            // Manual upload of the SharePoint tracking workbook. Writes the same
            // canonical `statusRaw` node the Power Automate sync writes, so a later
            // sync and a manual upload can't disagree about the source of truth.
            const handleStatusUpload = async (file) => {
                const { raw, meta } = await parseStatusWorkbook(file);
                if (isFirebaseConfigured && db) {
                    await db.ref('statusRaw').set(raw);
                    await db.ref('statusMeta').set(meta);
                }
                const { statusList: resolved } = resolveStatusRaw(raw);
                storage.save('statusList', resolved);
                storage.save('statusMeta', meta);
                setStatusList(resolved);
                setStatusMeta(meta);
                return meta;
            };

            const handleImportFile = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                e.target.value = '';

                try {
                    setImportStatus('Parsing...');
                    const { date, shift, lines, dailyRoster } = await parseStaffingXLSX(file);
                    const totalPeople = lines.reduce((sum, l) => sum + l.positions.length, 0);

                    const confirmed = confirm(
                        `Import: ${date} - ${shift} Shift\n` +
                        `${lines.length} line${lines.length !== 1 ? 's' : ''}, ${totalPeople} people assigned` +
                        (dailyRoster.length > 0 ? `, ${dailyRoster.length} on the roster` : '') +
                        `\n\nSave this to your reports?`
                    );
                    if (!confirmed) { setImportStatus(''); return; }

                    const docId = `${date}_${shift}`;
                    let alreadyExists = false;
                    let existingData = null;
                    if (isFirebaseConfigured && db) {
                        const snap = await db.ref('staffing/' + docId).once('value');
                        alreadyExists = snap.exists();
                        if (alreadyExists) existingData = snap.val();
                    }
                    if (!alreadyExists) {
                        alreadyExists = storage.load(`staffing_${date}_${shift}`, null) !== null;
                    }
                    if (alreadyExists) {
                        const overwrite = confirm(`A report for ${date} - ${shift} Shift already exists. Overwrite it?`);
                        if (!overwrite) { setImportStatus(''); return; }
                    }

                    const importNow = new Date().toISOString();
                    const importActor = user ? { uid: user.uid, email: user.email || '' } : null;
                    const staffingData = {
                        date, shift, lines, dailyRoster,
                        locked: false,
                        lastUpdated: importNow,
                        createdBy: (existingData && existingData.createdBy) || importActor,
                        createdAt: (existingData && existingData.createdAt) || importNow,
                        updatedBy: importActor,
                        updatedAt: importNow
                    };
                    reportMetaRef.current[docId] = { createdBy: staffingData.createdBy, createdAt: staffingData.createdAt };

                    if (isFirebaseConfigured && db) {
                        await db.ref('staffing/' + docId).set(staffingData);
                    }
                    storage.save(`staffing_${date}_${shift}`, staffingData);
                    logActivity(existingData ? 'report_imported_overwrite' : 'report_imported', docId);

                    setImportStatus(`Imported ${date} - ${shift} ✓`);
                    setTimeout(() => setImportStatus(''), 4000);
                } catch (err) {
                    console.error('Import error:', err);
                    setImportStatus(`Error: ${err.message}`);
                    setTimeout(() => setImportStatus(''), 6000);
                }
            };

            const handleSetupShift = (shiftData) => {
                setCurrentDate(shiftData.date);
                setCurrentShift(shiftData.shift);

                // If loading existing sheet, just load the data
                if (shiftData.loadExisting) {
                    loadStaffingData(shiftData.date, shiftData.shift);
                    setActiveTab('staffing');
                    return;
                }

                const newLines = shiftData.lines.map(line => {
                    // Support both old (single lead) and new (multiple leads) format
                    const leads = line.leads || (line.lead ? [line.lead] : []);

                    // Combine core associates from all leads
                    const allCoreAssociates = [];
                    leads.forEach(lead => {
                        // Try exact match first, then case-insensitive match
                        let coreList = coreAssociates[lead];
                        if (!coreList) {
                            const matchKey = Object.keys(coreAssociates).find(
                                k => k.toLowerCase() === lead.toLowerCase()
                            );
                            coreList = matchKey ? coreAssociates[matchKey] : [];
                        }
                        allCoreAssociates.push(...coreList);
                    });

                    // Drop associates who don't work this day of the week (part-time schedule).
                    const shiftDow = new Date((shiftData.date || '') + 'T00:00:00').getDay();
                    const availableCore = allCoreAssociates.filter(a => !(a.offDays || []).includes(shiftDow));

                    const needed = Math.max(0, parseInt(line.needed) || 0);

                    return {
                        id: Date.now() + Math.random(),
                        letter: line.letter,
                        leads: leads,
                        needed: needed,
                        isCut: false,
                        // Seed the line with its core team, then leave the rest open.
                        positions: Array(needed).fill(null).map((_, idx) => ({
                            id: Date.now() + Math.random() + idx,
                            name: idx < availableCore.length ? availableCore[idx].name : '',
                            isNew: false
                        }))
                    };
                });

                setLines(newLines);
                setDailyRoster([]);
                setIndirect(makeIndirectSlots(3));
                setActiveTab('staffing');
            };

            const handleUpdatePosition = (lineId, positionId, name, isNew) => {
                setLines(prev => prev.map(line => {
                    if (line.id === lineId) {
                        const prevPos = line.positions.find(p => p.id === positionId);
                        // A name is being removed if the slot had a name and now doesn't.
                        const nameCleared = prevPos && prevPos.name.trim() !== '' && name.trim() === '';
                        let positions = line.positions.map(pos =>
                            pos.id === positionId ? { ...pos, name, isNew } : pos
                        );
                        // When a name is removed, sink the now-open slot to the bottom of
                        // the line so open slots stay grouped.
                        if (nameCleared) positions = normalizeLinePositions(positions);
                        return { ...line, positions };
                    }
                    return line;
                }));
            };

            const handleUpdateRosterItem = (itemId, name, isNew) => {
                setDailyRoster(prev => prev.map(item =>
                    item.id === itemId ? { ...item, name: name, isNew } : item
                ));
            };

            const handleAddRosterItem = () => {
                setDailyRoster(prev => [...prev, {
                    id: Date.now() + Math.random(),
                    name: '',
                    isNew: false
                }]);
            };

            const handleQuickAddRoster = (names) => {
                const newItems = names.map(name => ({
                    id: Date.now() + Math.random(),
                    name: name,
                    isNew: false
                }));
                setDailyRoster(prev => [...prev, ...newItems]);
            };

            const handleRemoveRosterItem = (itemId) => {
                setDailyRoster(prev => prev.filter(item => item.id !== itemId));
            };

            // Load a day's roster from the Staffing screen. `mode` is 'replace'
            // (fresh start for the shift) or 'append' (late arrivals). Names already
            // assigned to a line are skipped so a re-load never duplicates anyone.
            const handleLoadRoster = (entries, mode) => {
                const assigned = new Set();
                lines.forEach(line => (line.positions || []).forEach(p => {
                    const n = (p.name || '').trim().toLowerCase();
                    if (n) assigned.add(n);
                }));

                setDailyRoster(prev => {
                    const base = mode === 'replace' ? [] : prev;
                    const existing = new Set(
                        base.map(i => (i.name || '').trim().toLowerCase()).filter(Boolean)
                    );
                    const additions = [];
                    entries.forEach((entry, idx) => {
                        const key = entry.name.trim().toLowerCase();
                        if (!key || existing.has(key) || assigned.has(key)) return;
                        existing.add(key);
                        additions.push({
                            id: Date.now() + Math.random() + idx,
                            name: entry.name,
                            isNew: false
                        });
                    });
                    return [...base, ...additions];
                });

                // Feed anyone with an employee ID into the master roster so name
                // autocomplete and the "last worked for" hints keep working.
                const withIds = entries.filter(e => e.employeeId);
                if (withIds.length) {
                    const updated = { ...roster };
                    withIds.forEach(e => {
                        const existing = updated[e.employeeId] || {};
                        const sp = e.name.indexOf(' ');
                        updated[e.employeeId] = {
                            ...existing,
                            employeeId: e.employeeId,
                            fullName: e.name,
                            firstName: sp !== -1 ? e.name.slice(0, sp) : e.name,
                            lastName: sp !== -1 ? e.name.slice(sp + 1) : '',
                            // Don't resurrect someone the Associates tab marked inactive.
                            status: existing.status || 'active',
                            isActive: existing.status ? existing.status === 'active' : true
                        };
                    });
                    setRoster(updated);
                    storage.save('roster', updated);
                    if (isFirebaseConfigured && db) {
                        db.ref('roster/associates').update(updated)
                          .catch(e => console.error('Error saving roster:', e));
                    }
                }
            };

            const handleAddLine = () => {
                const newLine = {
                    id: Date.now() + Math.random(),
                    letter: '',
                    leads: [],
                    needed: 5,
                    isCut: false,
                    positions: Array(5).fill(null).map((_, idx) => ({
                        id: Date.now() + Math.random() + idx,
                        name: '',
                        isNew: false
                    }))
                };
                setLines(prev => [...prev, newLine]);
            };

            const handleToggleCutLine = (lineId) => {
                const targetLine = lines.find(l => l.id === lineId);
                if (targetLine && !targetLine.isCut) {
                    pushUndo(`Line ${targetLine.letter || '?'} cut`);
                }
                setLines(prev => prev.map(line => {
                    if (line.id === lineId) {
                        const newCutStatus = !line.isCut;

                        // If marking as cut, move all assigned associates back to the roster
                        if (newCutStatus) {
                            const assignedAssociates = line.positions
                                .filter(p => p.name.trim())
                                .map(p => ({
                                    id: Date.now() + Math.random(),
                                    name: p.name,
                                    isNew: p.isNew
                                }));

                            if (assignedAssociates.length > 0) {
                                setDailyRoster(prev => [...prev, ...assignedAssociates]);
                            }

                            // Clear all positions
                            return {
                                ...line,
                                isCut: true,
                                positions: line.positions.map(p => ({ ...p, name: '', isNew: false }))
                            };
                        }

                        return { ...line, isCut: newCutStatus };
                    }
                    return line;
                }));
            };

            const handleDragStart = (e, source) => {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('application/json', JSON.stringify(source));

                // Create custom drag preview
                const dragPreview = document.createElement('div');
                dragPreview.className = 'drag-preview';

                // Get the name being dragged
                let dragName = '';
                if (source.type === 'dailyRoster') {
                    const item = dailyRoster.find(w => w.id === source.id);
                    dragName = item?.name || '';
                } else if (source.type === 'position') {
                    const line = lines.find(l => l.id === source.lineId);
                    const position = line?.positions.find(p => p.id === source.positionId);
                    dragName = position?.name || '';
                }

                dragPreview.innerHTML = `
                    <div style="min-width: 18px; font-size: 11px; font-weight: 600; color: #6b7280; text-align: center;">⋮⋮</div>
                    <div style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${dragName}</div>
                `;
                dragPreview.style.left = '-9999px';
                document.body.appendChild(dragPreview);
                e.dataTransfer.setDragImage(dragPreview, 0, 0);
                setTimeout(() => document.body.removeChild(dragPreview), 0);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            };

            const handleDrop = (e, target) => {
                e.preventDefault();
                let source;
                try {
                    source = JSON.parse(e.dataTransfer.getData('application/json'));
                } catch (err) {
                    console.error('Invalid drag data:', err);
                    return;
                }

                // Don't allow drops on cut lines
                if (target.type === 'position') {
                    const targetLine = lines.find(l => l.id === target.lineId);
                    if (targetLine && targetLine.isCut) {
                        return;
                    }
                }

                // Handle different drop scenarios
                if (source.type === 'dailyRoster' && target.type === 'position') {
                    // Move from the roster panel to a position
                    const rosterItem = dailyRoster.find(w => w.id === source.id);
                    const targetLine = lines.find(l => l.id === target.lineId);
                    const targetPosition = targetLine?.positions.find(p => p.id === target.positionId);

                    if (rosterItem && targetPosition) {
                        // If target position is filled, move that person back to the roster first
                        if (targetPosition.name.trim()) {
                            setDailyRoster(prev => [
                                ...prev.filter(w => w.id !== source.id),
                                {
                                    id: Date.now() + Math.random(),
                                    name: targetPosition.name,
                                    isNew: targetPosition.isNew
                                }
                            ]);
                        } else {
                            // Just remove from the roster panel
                            handleRemoveRosterItem(source.id);
                        }
                        // Assign the roster person to the position
                        handleUpdatePosition(target.lineId, target.positionId, rosterItem.name, rosterItem.isNew);
                    }
                } else if (source.type === 'position' && target.type === 'dailyRoster') {
                    // Move from a position back to the roster panel
                    const sourceLine = lines.find(l => l.id === source.lineId);
                    const sourcePosition = sourceLine?.positions.find(p => p.id === source.positionId);
                    if (sourcePosition && sourcePosition.name.trim()) {
                        setDailyRoster(prev => [...prev, {
                            id: Date.now() + Math.random(),
                            name: sourcePosition.name,
                            isNew: sourcePosition.isNew
                        }]);
                        handleUpdatePosition(source.lineId, source.positionId, '', false);
                    }
                } else if (source.type === 'position' && target.type === 'position') {
                    // Swap positions - use a single state update to avoid race conditions,
                    // then normalize so any slot left open sinks to the bottom of its line.
                    setLines(prev => prev.map(line => {
                        if (line.id === source.lineId || line.id === target.lineId) {
                            const positions = line.positions.map(pos => {
                                if (line.id === source.lineId && pos.id === source.positionId) {
                                    // Replace source with target's content
                                    const targetLine = prev.find(l => l.id === target.lineId);
                                    const targetPos = targetLine?.positions.find(p => p.id === target.positionId);
                                    return targetPos ? { ...pos, name: targetPos.name, isNew: targetPos.isNew } : pos;
                                } else if (line.id === target.lineId && pos.id === target.positionId) {
                                    // Replace target with source's content
                                    const sourceLine = prev.find(l => l.id === source.lineId);
                                    const sourcePos = sourceLine?.positions.find(p => p.id === source.positionId);
                                    return sourcePos ? { ...pos, name: sourcePos.name, isNew: sourcePos.isNew } : pos;
                                }
                                return pos;
                            });
                            return { ...line, positions: normalizeLinePositions(positions) };
                        }
                        return line;
                    }));
                }
            };

            const pushUndo = (msg) => {
                setUndoStack(prev => [...prev.slice(-4), { lines: JSON.parse(JSON.stringify(lines)), dailyRoster: JSON.parse(JSON.stringify(dailyRoster)) }]);
                setUndoMessage(msg);
                if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
                undoTimerRef.current = setTimeout(() => setUndoMessage(''), 8000);
            };

            const handleUndo = () => {
                if (undoStack.length === 0) return;
                const last = undoStack[undoStack.length - 1];
                setLines(last.lines);
                setDailyRoster(last.dailyRoster);
                setUndoStack(prev => prev.slice(0, -1));
                setUndoMessage('');
                if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
            };

            const handleRemoveLine = (lineId) => {
                const line = lines.find(l => l.id === lineId);
                const desc = line ? `Line ${line.letter || '?'}` : 'Line';
                if (confirm(`Remove ${desc}?`)) {
                    pushUndo(`${desc} removed`);
                    setLines(prev => prev.filter(l => l.id !== lineId));
                }
            };

            const handleUpdateLine = (lineId, updates) => {
                // Check for truncation before entering state updater
                if (updates.needed !== undefined && !updates.positions) {
                    const currentLine = lines.find(l => l.id === lineId);
                    if (currentLine) {
                        const newNeeded = parseInt(updates.needed) || 0;
                        if (newNeeded < currentLine.positions.length) {
                            const wouldLose = currentLine.positions.slice(newNeeded).filter(p => p.name.trim());
                            if (wouldLose.length > 0) {
                                const names = wouldLose.map(p => p.name).join(', ');
                                if (!confirm(`Reducing positions will remove: ${names}\n\nContinue?`)) {
                                    return;
                                }
                            }
                        }
                    }
                }

                setLines(prev => prev.map(line => {
                    if (line.id === lineId) {
                        const updatedLine = { ...line, ...updates };

                        if (updates.positions) {
                            return updatedLine;
                        }

                        if (updates.needed !== undefined) {
                            const newNeeded = parseInt(updates.needed) || 0;
                            const current = line.positions;

                            if (newNeeded > current.length) {
                                const additionalPositions = Array(newNeeded - current.length)
                                    .fill(null)
                                    .map((_, idx) => ({
                                        id: Date.now() + Math.random() + idx,
                                        name: '',
                                        isNew: false
                                    }));
                                updatedLine.positions = [...current, ...additionalPositions];
                            } else {
                                updatedLine.positions = current.slice(0, newNeeded);
                            }
                        }

                        return updatedLine;
                    }
                    return line;
                }));
            };

            const handleAddCoreAssociate = (lead, associate) => {
                setCoreAssociates(prev => ({
                    ...prev,
                    [lead]: [...(prev[lead] || []), associate]
                }));
            };

            const handleRemoveCoreAssociate = (lead, index) => {
                setCoreAssociates(prev => ({
                    ...prev,
                    [lead]: prev[lead].filter((_, i) => i !== index)
                }));
            };

            const handleUpdateCoreAssociate = (lead, index, updates) => {
                setCoreAssociates(prev => ({
                    ...prev,
                    [lead]: prev[lead].map((assoc, i) => i === index ? { ...assoc, ...updates } : assoc)
                }));
            };

            const handleDeleteLineLead = (lead) => {
                if (confirm(`Delete line lead "${lead}" and all associated core team members? This cannot be undone.`)) {
                    setCoreAssociates(prev => {
                        const updated = { ...prev };
                        delete updated[lead];
                        return updated;
                    });
                    setLineLeadNotes(prev => {
                        const updated = { ...prev };
                        delete updated[lead];
                        return updated;
                    });
                }
            };

            const handleRenameLineLead = (oldName, newName) => {
                if (!newName.trim() || newName === oldName) return;
                if (coreAssociates[newName]) {
                    alert(`A line lead named "${newName}" already exists.`);
                    return;
                }
                setCoreAssociates(prev => {
                    const updated = {};
                    Object.keys(prev).forEach(key => {
                        if (key === oldName) {
                            updated[newName] = prev[key];
                        } else {
                            updated[key] = prev[key];
                        }
                    });
                    return updated;
                });
                setLineLeadNotes(prev => {
                    const updated = {};
                    Object.keys(prev).forEach(key => {
                        if (key === oldName) {
                            updated[newName] = prev[key];
                        } else {
                            updated[key] = prev[key];
                        }
                    });
                    return updated;
                });
            };

            const handleUpdateLineLeadNotes = (lead, notes) => {
                setLineLeadNotes(prev => ({ ...prev, [lead]: notes }));
            };

            const handleExport = async () => {
                const lastFirst = storage.load('nameDisplayLastFirst', false);
                const fmtName = (n) => lastFirst ? formatLastFirst(n) : n;
                const wb = XLSX.utils.book_new();

                const activeLines = lines.filter(l => !l.isCut);
                const cutLines = lines.filter(l => l.isCut);
                const totalPositions = activeLines.reduce((s, l) => s + l.needed, 0);
                const filledPositions = activeLines.reduce((s, l) => s + l.positions.filter(p => p.name.trim()).length, 0);
                const newAssociates = activeLines.reduce((s, l) => s + l.positions.filter(p => p.name.trim() && p.isNew).length, 0);
                const unassignedCount = dailyRoster.filter(w => w.name.trim()).length;
                const indirectNames = (indirect || []).filter(i => i.name.trim());

                // Column-based grid: [line | spacer] per line, then dailyRoster. Spacer
                // columns are gutters (kept so exported files still re-import cleanly).
                const nCols = lines.length * 2 + 1;
                const lastCol = lines.length * 2;
                const pad = (row) => { while (row.length < nCols) row.push(''); return row; };
                const data = [];
                data.push(pad(['Line Planner']));
                data.push(pad([`${currentDate} · ${currentShift} Shift`, '', '', '', `Exported ${new Date().toLocaleString()}`]));
                data.push(pad([`Filled ${filledPositions}/${totalPositions}`, `New ${newAssociates}`, cutLines.length ? `Cut ${cutLines.length}` : '', unassignedCount ? `Unassigned ${unassignedCount}` : '', indirectNames.length ? `Indirect ${indirectNames.length}` : '']));
                data.push(pad([]));
                const hdr = []; lines.forEach(l => { hdr.push(`Line ${l.letter}${l.isCut ? ' (CUT)' : ''}`); hdr.push(''); }); hdr.push('ROSTER'); data.push(pad(hdr));
                const lead = []; lines.forEach(l => { lead.push((l.leads || []).join(', ') || 'No lead'); lead.push(''); }); lead.push('On-call'); data.push(pad(lead));
                const maxPos = Math.max(0, ...lines.map(l => l.positions.length), dailyRoster.length);
                for (let i = 0; i < maxPos; i++) {
                    const row = [];
                    lines.forEach(l => {
                        const nc = l.positions;
                        const p = nc[i];
                        row.push(p && p.name.trim() ? fmtName(p.name) + (p.isNew ? ' ⭐' : '') : '');
                        row.push('');
                    });
                    const w = dailyRoster[i];
                    row.push(w && w.name.trim() ? fmtName(w.name) + (w.isNew ? ' ⭐' : '') : '');
                    data.push(pad(row));
                }
                data.push(pad([]));
                const indHdrRow = data.length;
                data.push(pad(['INDIRECT — Off-Floor (not counted in fill)']));
                (indirectNames.length ? indirectNames.map(i => i.name) : ['(none)']).forEach(nm => data.push(pad([fmtName(nm)])));

                const ws = XLSX.utils.aoa_to_sheet(data);
                const cols = []; lines.forEach(() => { cols.push({ wch: 22 }); cols.push({ wch: 2 }); }); cols.push({ wch: 22 }); ws['!cols'] = cols;

                // ---- styling (borders + shading; readable in B&W via the grid + bold headers) ----
                const B = (c) => ({ style: 'thin', color: { rgb: c || '000000' } });
