            const activeCount   = rosterList.filter(a => a.isActive).length;
            const inactiveCount = rosterList.filter(a => !a.isActive).length;
            const flaggedCount  = rosterList.filter(a => disciplineFor(a)).length;
            const statusUpdated = statusMeta && statusMeta.updatedAt ? new Date(statusMeta.updatedAt) : null;

            // The DNR/flag list comes from the suspension/DNR data (statusList), keyed
            // by EID independent of the roster — so DNRs who aren't on the roster or are
            // inactive still appear. Each is cross-referenced to the roster.
            const rosterByEid = {};
            rosterList.forEach(a => { const k = normalizeEid(a.employeeId); if (k) rosterByEid[k] = a; });
            const flaggedList = Object.values(statusList || {})
                .map(e => ({ entry: e, status: resolveEntryStatus(e) }))
                .filter(x => x.status)
                .map(x => {
                    const m = rosterByEid[normalizeEid(x.entry.eid)];
                    return { ...x, roster: m ? (m.isActive ? 'active' : 'inactive') : 'none' };
                })
                .sort((a, b) => (STATUS_RANK[b.status.kind] - STATUS_RANK[a.status.kind]) ||
                    (a.entry.name || '').localeCompare(b.entry.name || ''));
            const visibleFlags = flaggedList.filter(x => {
                if (flagFilter === 'dnr' && !(x.status.kind === 'dnr' || x.status.kind === 'terminated')) return false;
                if (flagFilter === 'notactive' && x.roster === 'active') return false;
                if (search.trim() && !(x.entry.name || '').toLowerCase().includes(search.toLowerCase()) && !String(x.entry.eid).includes(search)) return false;
                return true;
            });
            const dnrTotal = flaggedList.filter(x => x.status.kind === 'dnr' || x.status.kind === 'terminated').length;
            const dnrOffRoster = flaggedList.filter(x => (x.status.kind === 'dnr' || x.status.kind === 'terminated') && x.roster !== 'active').length;
            const rosterLabel = (r) => r === 'active'
                ? <span className="roster-active-badge">Active</span>
                : r === 'inactive'

                        <div>
                            <h3 style={{ margin: 0, fontSize: '16px', color: '#1f2937' }}>Associate Roster</h3>
                            {lastSync
                                ? <div style={{ fontSize: '11px', color: '#9ca3af', marginTop: '2px' }}>Last synced: {new Date(lastSync).toLocaleString()}</div>
                                : <div style={{ fontSize: '11px', color: '#9ca3af', marginTop: '2px' }}>No roster synced yet</div>
                            }
                        </div>
                        <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                            {syncStatus && (
                                <span style={{ fontSize: '12px', color: syncStatus.startsWith('Error') ? '#dc2626' : '#059669', fontWeight: '600' }}>

                            <input ref={statusFileRef} type="file" accept=".xlsx,.xls" style={{ display: 'none' }} onChange={handleStatusFile} />
                            <button className="btn btn-secondary" onClick={() => statusFileRef.current.click()} title="Upload the suspension / DNR tracking sheet">
                                Upload Tracking Sheet

                            {statusUploadStatus && (

                    <div className="scan-box" style={{ marginBottom: '16px' }}>

                        <input

                    <div style={{ display: 'flex', gap: '8px', marginBottom: '12px', alignItems: 'center', flexWrap: 'wrap' }}>

                                style={{

                            </span>

                    </div>

                    <div style={{ display: 'flex', gap: '8px', marginBottom: '12px', flexWrap: 'wrap', alignItems: 'center' }}>
                        {search.trim() && (

                        <span style={{ flex: 1 }}></span>
                        {viewMode === 'roster' ? (

                                style={{ padding: '6px 10px', border: '1px solid #d1d5db', borderRadius: '4px', fontSize: '12px', background: 'white' }}
                                value={flagFilter}
                                onChange={(e) => setFlagFilter(e.target.value)}
                            >
                                <option value="all">All flags</option>
                                <option value="dnr">DNR / Terminated only</option>

                    </div>

                    {viewMode === 'flags' ? (
                        <div style={{ overflowX: 'auto', maxHeight: '520px', overflowY: 'auto', border: '1px solid #e5e7eb', borderRadius: '6px' }}>
                            <table className="roster-table">
                                <thead>
                                    <tr>
                                        <th>Flag</th>
                                        <th>Name</th>

                                            <td>{rosterLabel(r)}</td>
                                            <td style={{ color: '#6b7280', fontSize: '12px' }}>

                            <div style={{ fontSize: '14px', fontWeight: '600', color: '#6b7280' }}>No roster loaded</div>
                            <div style={{ fontSize: '12px', marginTop: '4px' }}>Upload a CSV or Excel file exported from your system to populate the roster.</div>
                            <div style={{ fontSize: '11px', marginTop: '8px', color: '#9ca3af' }}>Required columns: Employee ID · First Name · Last Name</div>
                        </div>
                    ) : (
                        <div style={{ overflowX: 'auto', maxHeight: '520px', overflowY: 'auto', border: '1px solid #e5e7eb', borderRadius: '6px' }}>
                            <table className="roster-table">
                                <thead>
                                    <tr>
                                        <th>Employee ID</th>
                                        <th>Name</th>
                                        <th>Core Lead / Skills</th>
                                        <th>Status</th>
                                        <th>Susp / DNR</th>
                                        <th>Assigned Shift</th>
                                        <th>Last Line</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filtered.map(a => (
                                        <tr key={a.employeeId}>
                                            <td style={{ fontFamily: 'monospace', color: '#6b7280', fontSize: '11px' }}>{a.employeeId}</td>
                                            <td style={{ fontWeight: '500' }}>{a.fullName}</td>
                                            <td>
                                                {(() => {

                                                    if (!ci || (ci.leads.length === 0 && ci.flags.length === 0)) return <span style={{ color: '#d1d5db' }}>—</span>;
                                                    return (

                                                            {ci.flags.length > 0 && (
                                                                <span style={{ display: 'flex', gap: '3px', flexWrap: 'wrap' }}>
                                                                    {ci.flags.map(fid => { const f = AVAILABLE_FLAGS.find(x => x.id === fid); return f ? <span key={fid} className={`flag-badge ${f.className}`}>{f.label}</span> : null; })}
                                                                </span>
                                                            )}
                                                        </div>
                                                    );
                                                })()}
                                            </td>
                                            <td>
                                                {a.isActive
                                                    ? <span className="roster-active-badge">Active</span>
                                                    : <span className="roster-inactive-badge">Inactive</span>
                                                }
                                            </td>
                                            <td>
                                                {(() => {
                                                    const d = disciplineFor(a);
                                                    return d
                                                        ? <span className={`flag-badge ${d.className}`} title={d.label}>{d.shortLabel}</span>
                                                        : <span style={{ color: '#d1d5db' }}>—</span>;
                                                })()}
                                            </td>
                                            <td>
                                                <select
                                                    value={a.assignedShift || ''}
                                                    onChange={e => onUpdateAssociate && onUpdateAssociate(a.employeeId, { assignedShift: e.target.value || null })}
                                                    style={{ fontSize: '11px', padding: '2px 4px', border: '1px solid #d1d5db', borderRadius: '4px', background: 'white', color: '#374151' }}
                                                >
                                                    <option value="">—</option>
                                                    <option value="1st">1st</option>
                                                    <option value="2nd">2nd</option>
                                                    <option value="3rd">3rd</option>

                                            </td>

                                                {a.lastLine

                            )}
                        </div>
                    )}
                </div>
            );
        }

        // ===== Authentication =====
        // Maps Firebase auth error codes to messages a supervisor can act on.
        function mapAuthError(err) {
            const code = (err && err.code) || '';
            switch (code) {
                case 'auth/invalid-email':
                    return 'That email address doesn’t look right.';
                case 'auth/user-disabled':
                    return 'This account has been disabled. Contact your administrator.';
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    return 'Incorrect email or password.';
                case 'auth/too-many-requests':
                    return 'Too many attempts. Wait a few minutes and try again.';
                case 'auth/operation-not-allowed':
                    return 'Email/Password accounts aren’t enabled in Firebase yet. An administrator needs to turn it on in the Firebase console.';
                case 'auth/email-already-in-use':
                    return 'An account already exists for that email. Try signing in instead.';
                case 'auth/weak-password':
                    return 'Password is too weak — use at least 6 characters.';
                case 'auth/network-request-failed':
                    return 'Network error. Check your connection and try again.';
                default:
                    return (err && err.message) || 'Something went wrong. Please try again.';
            }
        }

        // ===== Activity / audit logging =====
        // The signed-in user performing an action, or null (offline / auth disabled).
        function currentActor() {
            const u = isAuthEnabled && auth ? auth.currentUser : null;
            return u ? { uid: u.uid, email: u.email || '' } : null;
        }

        // Append a discrete event to the audit feed. Fire-and-forget; never blocks the UI.
        // Used for low-volume events (login, create, delete) — NOT per-keystroke edits,
        // which are captured by updatedBy/updatedAt on the report instead.
        function logActivity(action, target) {
            if (!isFirebaseConfigured || !db) return;
            const actor = currentActor();
            try {
                db.ref('activity').push({
                    at: new Date().toISOString(),
                    uid: actor ? actor.uid : null,
                    email: actor ? actor.email : null,
                    action: action,
                    target: target || null
                });
            } catch (e) { console.error('logActivity failed:', e); }
        }

        // Upsert the per-user record. `fresh` = an explicit sign-in/sign-up (bumps
        // lastLoginAt + loginCount); otherwise it's a session restore (lastSeenAt only).
        function recordUserSession(u, fresh) {
            if (!isFirebaseConfigured || !db || !u) return;
            const ref = db.ref('users/' + u.uid);
            const now = new Date().toISOString();
            ref.child('firstSeenAt').once('value').then((snap) => {
                const updates = { email: u.email || '', lastSeenAt: now };
                if (!snap.exists()) updates.firstSeenAt = now;
                if (fresh) updates.lastLoginAt = now;
                return ref.update(updates);
            }).then(() => {
                if (fresh) {
                    ref.child('loginCount').transaction((c) => (c || 0) + 1);
                }
            }).catch((e) => console.error('recordUserSession failed:', e));
        }


        // Status is the first column on purpose: it's the switch that decides
        // who lands on the staffing roster, mirroring the column the site added
        // at A on the recruiting spreadsheet.
        function AssociatesView({ roster, attendance, placementIndex, onUploadRoster, onSetStatus, onUpdateAssociate, onUpdateAttendanceDay, onUpdateAttendanceNotes, currentDate, firebaseStatus }) {
            const [search, setSearch] = useState('');
            const [statusFilter, setStatusFilter] = useState('active');
            const [dayFilter, setDayFilter] = useState('all');
            const [uploadStatus, setUploadStatus] = useState('');
            const [uploadDetail, setUploadDetail] = useState(null);
            const [openProfile, setOpenProfile] = useState(null); // associate key
            const fileRef = useRef(null);

            const handleFile = async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                e.target.value = '';
                setUploadStatus('Parsing...');
                setUploadDetail(null);
                try {
                    const res = await onUploadRoster(file);
                    setUploadStatus('');
                    setUploadDetail(res);
                } catch (err) {
                    setUploadStatus(`Error: ${err.message}`);
                    setUploadDetail(null);
                }
            };

            const entries = Object.entries(roster || {})
                .filter(([, a]) => (a.fullName || '').trim())
                .filter(([, a]) => {
                    if (statusFilter === 'active' && !isAssociateActive(a)) return false;
                    if (statusFilter === 'inactive' && isAssociateActive(a)) return false;
                    return true;
                })
                .filter(([, a]) => {
                    if (dayFilter === 'all') return true;
                    return scheduledDowList(a).includes(Number(dayFilter));
                })
                .filter(([key, a]) => {
                    const q = search.trim().toLowerCase();
                    if (!q) return true;
                    return (a.fullName || '').toLowerCase().includes(q)
                        || String(a.crmNumber || '').includes(q)
                        || String(a.employeeId || key).toLowerCase().includes(q)
                        || (a.recruiter || '').toLowerCase().includes(q);
                })
                .sort(([, a], [, b]) => lastNameKey(a.fullName).localeCompare(lastNameKey(b.fullName)));

            const all = Object.values(roster || {}).filter(a => (a.fullName || '').trim());
            const activeCount = all.filter(isAssociateActive).length;

            const profileAssoc = openProfile ? (roster || {})[openProfile] : null;

            return (
                <div className="panel-view">
                    <div className="form-section" style={{ marginBottom: '16px' }}>
                        <h3>Associate Roster</h3>
                        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px', alignItems: 'center' }}>
                            <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} style={{ display: 'none' }} />
                            <button className="btn btn-primary" onClick={() => fileRef.current && fileRef.current.click()}>
                                Upload Roster Spreadsheet
                            </button>
                            <span className="quick-add-hint" style={{ margin: 0 }}>
                                Reads the recruiting roster as-is — name, scheduled days, start date, CRM #, phone,
                                background, language, recruiter and notes. Re-uploading updates the people already
                                here and adds anyone new; nobody is ever deleted. NCNS / Terminate / Declines tabs
                                flip those people to inactive.
                            </span>
                        </div>
                        {uploadStatus && (
                            <div style={{ marginTop: '10px', fontSize: '12px', fontWeight: 600, color: uploadStatus.startsWith('Error') ? '#991b1b' : '#374151' }}>
                                {uploadStatus}
                            </div>
                        )}
                        {uploadDetail && (
                            <div style={{ marginTop: '10px', padding: '10px 12px', background: '#ecfdf5', border: '1px solid #a7f3d0', borderRadius: '6px', fontSize: '12px', color: '#065f46' }}>
                                <strong>{uploadDetail.fileName}</strong> — {uploadDetail.total} row{uploadDetail.total === 1 ? '' : 's'} read ·{' '}
                                {uploadDetail.created} new · {uploadDetail.changed} updated
                                {uploadDetail.deactivated > 0 && <> · {uploadDetail.deactivated} set inactive</>}
                                {uploadDetail.skipped > 0 && <> · {uploadDetail.skipped} header/total row{uploadDetail.skipped === 1 ? '' : 's'} ignored</>}
                                {firebaseStatus !== 'connected' && <> · saved locally (offline)</>}
                            </div>
                        )}
                    </div>

                    <div className="filter-controls">
                        <div className="filter-row">
                            <input
                                className="search-box"
                                style={{ maxWidth: '280px' }}
                                placeholder="Search name, CRM #, recruiter..."
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                            />
                            <span className="filter-label">Status</span>
                            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} style={{ padding: '6px 8px', fontSize: '12px', borderRadius: '6px', border: '1px solid #d1d5db' }}>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                                <option value="all">All</option>
                            </select>
                            <span className="filter-label">Scheduled</span>
                            <select value={dayFilter} onChange={(e) => setDayFilter(e.target.value)} style={{ padding: '6px 8px', fontSize: '12px', borderRadius: '6px', border: '1px solid #d1d5db' }}>
                                <option value="all">Any day</option>
                                {DOW_LABELS.map((lbl, i) => <option key={i} value={i}>{DOW_LONG[i]}</option>)}
                            </select>
                            <span style={{ marginLeft: 'auto', fontSize: '12px', color: '#6b7280' }}>
                                {entries.length} shown · <strong style={{ color: '#059669' }}>{activeCount}</strong> active of {all.length}
                            </span>
                        </div>
                    </div>

                    {entries.length === 0 ? (
                        <div className="empty-state">
                            <h3>No associates yet</h3>
                            <p>Upload the roster spreadsheet to get started.</p>
                        </div>
                    ) : (
                        <div style={{ border: '1px solid #e5e7eb', borderRadius: '8px', overflow: 'hidden' }}>
                            <div className="assoc-row assoc-head">
                                <div className="assoc-status">Status</div>
                                <div className="assoc-name">Name</div>
                                <div className="assoc-days">Scheduled</div>
                                <div className="assoc-cell">Start Date</div>
                                <div className="assoc-cell">CRM #</div>
                                <div className="assoc-cell">Phone</div>
                                <div className="assoc-cell">Recruiter</div>
                                <div className="assoc-actions"></div>
                            </div>
                            <div style={{ maxHeight: '58vh', overflowY: 'auto' }}>
                                {entries.map(([key, a]) => (
                                    <div key={key} className={`assoc-row ${isAssociateActive(a) ? '' : 'assoc-inactive'}`}>
                                        <div className="assoc-status">
                                            <select
                                                className={`status-select ${isAssociateActive(a) ? 'is-active' : 'is-inactive'}`}
                                                value={isAssociateActive(a) ? 'active' : 'inactive'}
                                                onChange={(e) => onSetStatus(key, e.target.value)}
                                            >
                                                <option value="active">Active</option>
                                                <option value="inactive">Inactive</option>
                                            </select>
                                        </div>
                                        <div className="assoc-name">
                                            <button className="link-btn" onClick={() => setOpenProfile(key)}>{a.fullName}</button>
                                            {a.inactiveReason && !isAssociateActive(a) && (
                                                <span className="flag-badge flag-low" style={{ marginLeft: '6px' }}>{a.inactiveReason}</span>
                                            )}
                                        </div>
                                        <div className="assoc-days">
                                            {DOW_LABELS.map((lbl, i) => (
                                                <span key={i} className={`day-chip ${scheduledDowList(a).includes(i) ? 'on' : ''}`} title={DOW_LONG[i]}>{DOW_MINI[i]}</span>
                                            ))}
                                        </div>
                                        <div className="assoc-cell">{a.startDate ? formatShortDate(a.startDate) : '—'}</div>
                                        <div className="assoc-cell">{a.crmNumber || '—'}</div>
                                        <div className="assoc-cell">{a.phone || '—'}</div>
                                        <div className="assoc-cell">{a.recruiter || '—'}</div>
                                        <div className="assoc-actions">
                                            <button className="btn btn-secondary btn-small" onClick={() => setOpenProfile(key)}>Profile</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {profileAssoc && (
                        <AssociateProfile
                            assocKey={openProfile}
                            associate={profileAssoc}
                            attendance={attendance}
                            placementIndex={placementIndex}
                            currentDate={currentDate}
                            onUpdateAssociate={onUpdateAssociate}
                            onSetStatus={onSetStatus}
                            onUpdateAttendanceDay={onUpdateAttendanceDay}
                            onUpdateAttendanceNotes={onUpdateAttendanceNotes}
                            onClose={() => setOpenProfile(null)}
                        />
                    )}
