            );
        }

        // One associate's page: the details the recruiting sheet carries, the
        // days they're scheduled for, and their attendance week by week.
        function AssociateProfile({ assocKey, associate, attendance, placementIndex, currentDate, onUpdateAssociate, onSetStatus, onUpdateAttendanceDay, onUpdateAttendanceNotes, onClose }) {
            const [draft, setDraft] = useState(associate);
            const [weekEnding, setWeekEnding] = useState(() => weekEndingOf(currentDate || new Date()));

            useEffect(() => { setDraft(associate); }, [associate]);

            const setField = (field, value) => {
                setDraft(d => ({ ...d, [field]: value }));
            };
            const commit = (field) => {
                if ((associate[field] || '') === (draft[field] || '')) return;
                onUpdateAssociate(assocKey, { [field]: draft[field] || '', updatedAt: new Date().toISOString() });
            };
            const toggleDay = (dow) => {
                const cur = scheduledDowList(draft);
                const next = cur.includes(dow) ? cur.filter(d => d !== dow) : [...cur, dow].sort();
                setDraft(d => ({ ...d, scheduledDays: next }));
                onUpdateAssociate(assocKey, { scheduledDays: next, updatedAt: new Date().toISOString() });
            };

            const week = attendance[weekEnding] || { entries: {} };
            const entry = (week.entries && week.entries[assocKey]) || { notes: '', days: {} };
            const dates = weekDates(weekEnding);

            // Running totals across every week on file.
            const history = React.useMemo(() => {
                const tally = { present: 0, absent: 0, confirmed: 0, calloff: 0, ncns: 0, excused: 0, pto: 0 };
                Object.keys(attendance || {}).forEach(wk => {
                    const wkEntry = ((attendance[wk] || {}).entries || {})[assocKey];
                    weekDates(wk).forEach(iso => {
                        const res = resolveAttendance(associate, iso, placementIndex, wkEntry);
                        if (res.status === 'present') tally.present += 1;
                        else if (res.status === 'absent') {
                            tally.absent += 1;
                            if (res.reason && tally[res.reason] !== undefined) tally[res.reason] += 1;
                        }
                        if (res.confirmed) tally.confirmed += 1;
                    });
                });
                return tally;
            }, [attendance, associate, placementIndex, assocKey]);

            const field = (label, key, type) => (
                <div className="form-group">
                    <label>{label}</label>
                    <input
                        type={type || 'text'}
                        value={draft[key] || ''}
                        onChange={(e) => setField(key, e.target.value)}
                        onBlur={() => commit(key)}
                    />
                </div>
            );

            return (
                <div className="quick-add-modal" onClick={onClose}>
                    <div className="quick-add-content panel-view" style={{ maxWidth: '820px', width: '92%' }} onClick={(e) => e.stopPropagation()}>
                        <div className="quick-add-header">
                            <h3 className="quick-add-title">{associate.fullName}</h3>
                            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                                <select
                                    className={`status-select ${isAssociateActive(associate) ? 'is-active' : 'is-inactive'}`}
                                    value={isAssociateActive(associate) ? 'active' : 'inactive'}
                                    onChange={(e) => onSetStatus(assocKey, e.target.value)}
                                >
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                </select>
                                <button className="btn btn-secondary btn-small" onClick={onClose}>×</button>
                            </div>
                        </div>

                        <div className="form-grid" style={{ marginBottom: '4px' }}>
                            {field('Start Date', 'startDate', 'date')}
                            {field('CRM #', 'crmNumber')}
                            {field('Phone', 'phone')}
                            {field('Background', 'background')}
                            {field('Language', 'language')}
                            {field('Recruiter', 'recruiter')}
                        </div>

                        <div className="form-group" style={{ marginBottom: '12px' }}>
                            <label>Scheduled Days</label>
                            <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                                {DOW_LABELS.map((lbl, i) => (
                                    <button
                                        key={i}
                                        className={`day-toggle ${scheduledDowList(draft).includes(i) ? 'on' : ''}`}
                                        onClick={() => toggleDay(i)}
                                        title={DOW_LONG[i]}
                                    >
                                        {lbl}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="form-group" style={{ marginBottom: '14px' }}>
                            <label>Notes</label>
                            <textarea
                                rows={2}
                                value={draft.notes || ''}
                                onChange={(e) => setField('notes', e.target.value)}
                                onBlur={() => commit('notes')}
                            />
                        </div>

                        <div className="form-section" style={{ marginBottom: '0' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
                                <h3 style={{ margin: 0 }}>Attendance</h3>
                                <button className="btn btn-secondary btn-small" onClick={() => setWeekEnding(w => shiftWeek(w, -1))}>‹</button>
                                <span style={{ fontSize: '12px', fontWeight: 700 }}>Week ending {formatShortDate(weekEnding)}</span>
                                <button className="btn btn-secondary btn-small" onClick={() => setWeekEnding(w => shiftWeek(w, 1))}>›</button>
                                <span style={{ marginLeft: 'auto', fontSize: '11px', color: '#6b7280' }}>
                                    All-time: {history.present} present · {history.absent} absent
                                    {history.ncns > 0 && <> · {history.ncns} NCNS</>}
                                    {history.calloff > 0 && <> · {history.calloff} call-off</>}
                                    {history.pto > 0 && <> · {history.pto} PTO</>}
                                </span>
                            </div>

                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '6px' }}>
                                {dates.map(iso => {
                                    const res = resolveAttendance(associate, iso, placementIndex, entry);
                                    const d = parseSheetDate(iso);
                                    return (
                                        <div key={iso} className={`att-day att-${res.status || 'none'}`}>
                                            <div className="att-day-label">{DOW_LABELS[d.getDay()]} {d.getMonth() + 1}/{d.getDate()}</div>
                                            <select
                                                value={res.status}
                                                onChange={(e) => onUpdateAttendanceDay(weekEnding, assocKey, iso, { status: e.target.value })}
                                            >
                                                <option value="">—</option>
                                                <option value="present">Present</option>
                                                <option value="absent">Absent</option>
                                            </select>
                                            {res.status === 'absent' && (
                                                <select
                                                    value={res.reason}
                                                    onChange={(e) => onUpdateAttendanceDay(weekEnding, assocKey, iso, { reason: e.target.value })}
                                                >
                                                    <option value="">Reason…</option>
                                                    {ABSENCE_REASONS.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}
                                                </select>
                                            )}
                                            <label className="att-confirm">
                                                <input
                                                    type="checkbox"
                                                    checked={res.confirmed}
                                                    onChange={(e) => onUpdateAttendanceDay(weekEnding, assocKey, iso, { confirmed: e.target.checked })}
                                                />
                                                confirmed
                                            </label>
                                            {res.placedOn && <div className="att-placed">Line {res.placedOn}</div>}
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="form-group" style={{ marginTop: '12px', marginBottom: 0 }}>
                                <label>Notes for week ending {formatShortDate(weekEnding)}</label>
                                <textarea
                                    rows={2}
                                    defaultValue={entry.notes || ''}
                                    key={`${assocKey}-${weekEnding}`}
                                    onBlur={(e) => onUpdateAttendanceNotes(weekEnding, assocKey, e.target.value)}
                                />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Weekly attendance. Present/absent is read off the saved staffing
        // sheets — on a line means present, on the roster and scheduled but not
        // placed means absent — and each cell can be overridden with the reason.
        // The "C" box is the confirmation the site tracks with an X on the
        // recruiting sheet; confirmed-vs-showed is summarised at the top.
        function AttendanceView({ roster, attendance, placementIndex, currentDate, scorecardSettings, onUpdateAttendanceDay, onUpdateAttendanceNotes }) {
            const [weekEnding, setWeekEnding] = useState(() => weekEndingOf(currentDate || new Date()));
            const [search, setSearch] = useState('');
            const [scope, setScope] = useState('scheduled'); // 'scheduled' | 'active' | 'all'
            const [onlyIssues, setOnlyIssues] = useState(false);

            const workDays = (scorecardSettings && scorecardSettings.workDays) || SCORECARD_DEFAULTS.workDays;
            const allDates = weekDates(weekEnding);
            const dates = allDates.filter(iso => {
                const d = parseSheetDate(iso);
                return d && workDays.includes(d.getDay());
            });
            const shownDates = dates.length ? dates : allDates;

            const week = attendance[weekEnding] || { entries: {} };
            const entryFor = (key) => (week.entries && week.entries[key]) || { notes: '', days: {} };

            const people = Object.entries(roster || {})
                .filter(([, a]) => (a.fullName || '').trim())
                .filter(([, a]) => scope === 'all' ? true : isAssociateActive(a))
                .filter(([, a]) => {
                    if (scope !== 'scheduled') return true;
                    // Anyone who actually worked a day this week belongs on the
                    // sheet whatever their scheduled days say.
                    const worked = shownDates.some(iso =>
                        placementIndex[iso] && placementIndex[iso][normalizeName(a.fullName || '')]);
                    if (worked) return true;
                    const days = scheduledDowList(a);
                    if (!days.length) return false;
                    return shownDates.some(iso => isScheduledOn(a, iso));
                })
                .filter(([, a]) => {
                    const q = search.trim().toLowerCase();
                    return !q || (a.fullName || '').toLowerCase().includes(q);
                })
                .sort(([, a], [, b]) => lastNameKey(a.fullName).localeCompare(lastNameKey(b.fullName)));

            const rows = people.map(([key, a]) => {
                const entry = entryFor(key);
                const days = shownDates.map(iso => ({ iso, ...resolveAttendance(a, iso, placementIndex, entry) }));
                return { key, assoc: a, entry, days };
            }).filter(r => !onlyIssues || r.days.some(d => d.status === 'absent'));

            // Confirmed vs showed, the metric the X-and-highlight system on the
            // spreadsheet was standing in for.
            const metrics = shownDates.map(iso => {
                let confirmed = 0, present = 0, absent = 0, confirmedNoShow = 0;
                people.forEach(([key, a]) => {
                    const res = resolveAttendance(a, iso, placementIndex, entryFor(key));
                    if (res.confirmed) confirmed += 1;
                    if (res.status === 'present') present += 1;
                    if (res.status === 'absent') {
                        absent += 1;
                        if (res.confirmed) confirmedNoShow += 1;
                    }
                });
                return { iso, confirmed, present, absent, confirmedNoShow, showRate: confirmed ? present / confirmed : null };
            });
            const weekTotals = metrics.reduce((acc, m) => ({
                confirmed: acc.confirmed + m.confirmed,
                present: acc.present + m.present,
                absent: acc.absent + m.absent,
                confirmedNoShow: acc.confirmedNoShow + m.confirmedNoShow
            }), { confirmed: 0, present: 0, absent: 0, confirmedNoShow: 0 });
            const weekShowRate = weekTotals.confirmed ? weekTotals.present / weekTotals.confirmed : null;

            const exportWeek = () => {
                const header = ['Associate', 'Status'];
                shownDates.forEach(iso => {
                    const d = parseSheetDate(iso);
                    header.push(`${DOW_LABELS[d.getDay()]} ${d.getMonth() + 1}/${d.getDate()} Confirmed`);
                    header.push(`${DOW_LABELS[d.getDay()]} ${d.getMonth() + 1}/${d.getDate()}`);
                });
                header.push('Present', 'Absent', 'Notes');
                const aoa = [[`Attendance — week ending ${weekEnding}`], [], header];
                rows.forEach(r => {
                    const line = [r.assoc.fullName, isAssociateActive(r.assoc) ? 'Active' : 'Inactive'];
                    let p = 0, ab = 0;
                    r.days.forEach(d => {
                        line.push(d.confirmed ? 'X' : '');
                        if (d.status === 'present') { line.push('Present'); p += 1; }
                        else if (d.status === 'absent') { line.push(reasonLabel(d.reason) || 'Absent'); ab += 1; }
                        else line.push('');
                    });
                    line.push(p, ab, r.entry.notes || '');
                    aoa.push(line);
                });
                aoa.push([]);
                aoa.push(['Totals', '', ...shownDates.flatMap((iso, i) => [metrics[i].confirmed, metrics[i].present])]);
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(aoa);
                ws['!cols'] = [{ wch: 30 }, { wch: 10 }, ...shownDates.flatMap(() => [{ wch: 12 }, { wch: 14 }]), { wch: 9 }, { wch: 9 }, { wch: 40 }];
                XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
                XLSX.writeFile(wb, `attendance-week-ending-${weekEnding}.xlsx`);
            };

            return (
                <div className="panel-view">
                    <div className="filter-controls">
                        <div className="filter-row">
                            <button className="btn btn-secondary btn-small" onClick={() => setWeekEnding(w => shiftWeek(w, -1))}>‹ Prev</button>
                            <input
                                type="date"
                                value={weekEnding}
                                onChange={(e) => setWeekEnding(weekEndingOf(e.target.value))}
                                style={{ padding: '6px 8px', fontSize: '12px', borderRadius: '6px', border: '1px solid #d1d5db' }}
                                title="Any date in the week — it snaps to that week's Sunday"
                            />
                            <button className="btn btn-secondary btn-small" onClick={() => setWeekEnding(w => shiftWeek(w, 1))}>Next ›</button>
                            <span style={{ fontSize: '12px', fontWeight: 700, color: '#374151' }}>Week ending {formatShortDate(weekEnding)}</span>
                            <input
                                className="search-box"
                                style={{ maxWidth: '200px' }}
                                placeholder="Search name..."
                                value={search}
                                onChange={(e) => setSearch(e.target.value)}
                            />
                            <select value={scope} onChange={(e) => setScope(e.target.value)} style={{ padding: '6px 8px', fontSize: '12px', borderRadius: '6px', border: '1px solid #d1d5db' }}>
                                <option value="scheduled">Scheduled this week</option>
                                <option value="active">All active</option>
                                <option value="all">Everyone</option>
                            </select>
                            <label style={{ fontSize: '12px', display: 'flex', alignItems: 'center', gap: '4px' }}>
                                <input type="checkbox" checked={onlyIssues} onChange={(e) => setOnlyIssues(e.target.checked)} />
                                Absences only
                            </label>
                            <button className="btn btn-secondary btn-small" style={{ marginLeft: 'auto' }} onClick={exportWeek} disabled={!rows.length}>
                                Export Week
                            </button>
                        </div>
                    </div>

                    <div className="metric-strip">
                        <div className="metric-card">
                            <div className="metric-label">Confirmed</div>
                            <div className="metric-value">{weekTotals.confirmed}</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-label">Showed</div>
                            <div className="metric-value" style={{ color: '#059669' }}>{weekTotals.present}</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-label">Show rate</div>
                            <div className={`metric-value ${fillPctClass(weekShowRate)}`}>{weekShowRate === null ? '—' : fmtPct(weekShowRate)}</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-label">Confirmed no-shows</div>
                            <div className="metric-value" style={{ color: '#b91c1c' }}>{weekTotals.confirmedNoShow}</div>
                        </div>
                        <div className="metric-card">
                            <div className="metric-label">Absences</div>
                            <div className="metric-value">{weekTotals.absent}</div>
                        </div>
                    </div>

                    {rows.length === 0 ? (
                        <div className="empty-state">
                            <h3>Nobody to show</h3>
                            <p>Upload the roster on the Associates tab, or widen the filter above.</p>
                        </div>
                    ) : (
                        <div style={{ border: '1px solid #e5e7eb', borderRadius: '8px', overflow: 'auto', maxHeight: '60vh' }}>
                            <table className="att-table">
                                <thead>
                                    <tr>
                                        <th className="att-sticky">Associate</th>
                                        {shownDates.map((iso, i) => {
                                            const d = parseSheetDate(iso);
                                            return (
                                                <th key={iso} colSpan={2}>
                                                    {DOW_LABELS[d.getDay()]} {d.getMonth() + 1}/{d.getDate()}
                                                    <div className="att-th-sub">{metrics[i].confirmed} conf · {metrics[i].present} in</div>
                                                </th>
                                            );
                                        })}
                                        <th style={{ minWidth: '220px' }}>Notes (week)</th>
                                    </tr>
                                    <tr className="att-subhead">
                                        <th className="att-sticky"></th>
                                        {shownDates.map(iso => (
                                            <React.Fragment key={iso}>
                                                <th title="Confirmed they'll attend">C</th>
                                                <th>Attendance</th>
                                            </React.Fragment>
                                        ))}
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows.map(r => (
                                        <tr key={r.key}>
                                            <td className="att-sticky att-name">
                                                {r.assoc.fullName}
                                                {!isAssociateActive(r.assoc) && <span className="flag-badge flag-low" style={{ marginLeft: '6px' }}>Inactive</span>}
                                            </td>
                                            {r.days.map(d => (
                                                <React.Fragment key={d.iso}>
                                                    <td className="att-confirm-cell">
                                                        <input
                                                            type="checkbox"
                                                            checked={d.confirmed}
                                                            onChange={(e) => onUpdateAttendanceDay(weekEnding, r.key, d.iso, { confirmed: e.target.checked })}
                                                            title={d.confirmed ? 'Confirmed' : 'Not confirmed'}
                                                        />
                                                    </td>
                                                    <td className={`att-cell att-${d.status || 'none'}`}>
                                                        {d.status === 'present' ? (
                                                            <span className="att-present-tag" title={d.placedOn ? `Line ${d.placedOn}` : 'Placed on a line'}>
                                                                Present{d.placedOn ? ` · ${d.placedOn}` : ''}
                                                            </span>
                                                        ) : d.status === 'absent' ? (
                                                            <select
                                                                className="att-reason"
                                                                value={d.reason}
                                                                onChange={(e) => onUpdateAttendanceDay(weekEnding, r.key, d.iso, { reason: e.target.value })}
                                                            >
                                                                <option value="">Absent</option>
                                                                {ABSENCE_REASONS.map(x => <option key={x.id} value={x.id}>{x.label}</option>)}
                                                            </select>
                                                        ) : (
                                                            <span className="att-off">off</span>
                                                        )}
                                                        <button
                                                            className="att-flip"
                                                            title={d.overridden ? 'Clear the manual override' : (d.status === 'present' ? 'Mark absent' : 'Mark present')}
                                                            onClick={() => onUpdateAttendanceDay(weekEnding, r.key, d.iso, {
                                                                status: d.overridden ? '' : (d.status === 'present' ? 'absent' : 'present')
                                                            })}
                                                        >
                                                            {d.overridden ? '↺' : '⇄'}
                                                        </button>
                                                    </td>
                                                </React.Fragment>
                                            ))}
                                            <td>
                                                <input
                                                    className="att-notes"
                                                    defaultValue={r.entry.notes || ''}
                                                    key={`${r.key}-${weekEnding}`}
                                                    placeholder="Notes for this week..."
                                                    onBlur={(e) => onUpdateAttendanceNotes(weekEnding, r.key, e.target.value)}
                                                />
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    <div className="quick-add-hint" style={{ marginTop: '10px' }}>
                        Attendance follows the staffing sheets: on a line that day means present, scheduled but not
                        placed means absent. Use ⇄ to override a day by hand and ↺ to hand it back to the sheet.
                    </div>
                </div>
            );
        }

        // The Korpack scorecard week block, filled from the planner. Shaded
        // cells are derived (and can still be typed over); white cells are the
        // ones the tool can't know and stay editable.
        function ScorecardView({ staffingReports, attendance, scorecards, scorecardSettings, currentDate, onUpdateScorecard, onSaveSettings }) {
            const [weekEnding, setWeekEnding] = useState(() => weekEndingOf(currentDate || new Date()));
            const [showSettings, setShowSettings] = useState(false);
            const [settingsDraft, setSettingsDraft] = useState(scorecardSettings);

            useEffect(() => { setSettingsDraft(scorecardSettings); }, [scorecardSettings]);

            const saved = scorecards[weekEnding] || null;
            const weekAtt = attendance[weekEnding] || null;
            const week = React.useMemo(
                () => buildScorecardWeek(weekEnding, staffingReports, weekAtt, saved, scorecardSettings),
                [weekEnding, staffingReports, weekAtt, saved, scorecardSettings]
            );

            const cellValue = (row, day) => {
                if (row.kind === 'manual') {
                    const v = (saved && saved.manual && saved.manual[day.date] || {})[row.id];
                    return v === undefined || v === null ? '' : v;
                }
                const o = (day.overrides || {})[row.id];
                return o === undefined || o === null ? '' : o;
            };

            // Lays the week out exactly like one block of the Korpack workbook:
            // KPI panel in A/B, row labels in C, a column per day in D..G and the
            // week total in H, with the same blank spacer rows. Percentages go out
            // as real numbers with a percent format so Excel can do arithmetic on
            // them.
            const exportScorecard = () => {
                const dayLabel = (iso) => {
                    const d = parseSheetDate(iso);
                    return `${DOW_LABELS[d.getDay()]} ${d.getMonth() + 1}/${d.getDate()}`;
                };
                const rowById = (id) => SCORECARD_ROWS.find(r => r.id === id);
                const blank = (v) => (v === null || v === undefined || isNaN(v)) ? '' : v;
                const metricRow = (id) => {
                    const row = rowById(id);
                    return [
                        ...week.days.map(d => blank(d.values[id])),
                        blank(week.totals[id])
                    ].map(v => (v === '' ? '' : (row.percent ? v : Math.round(v))));
                };
                const width = 4 + week.days.length; // A,B,C + days + totals
                const pad = (row) => { while (row.length < width) row.push(''); return row; };

                // [A, B, C, ...days, total] — the blank rows are the workbook's own.
                const aoa = [
                    pad([week.site, '', formatShortDate(week.weekEnding), ...week.dates.map(dayLabel), 'TOTALS']),
                    pad(['', '', 'Shift', ...week.days.map(() => week.shiftLabel), 'Week']),
                    pad(['AVG. DAILY PC', '', 'Forecasted', ...metricRow('forecasted')]),
                    pad([blank(week.kpi.avgDailyPc), '', 'Confirmed', ...metricRow('confirmed')]),
                    pad(['', '', 'Required', ...metricRow('required')]),
                    pad(['OVERALL FILL RATE', '', 'Working - Direct Only', ...metricRow('working')]),
                    pad([blank(week.kpi.overallFillRate), '', 'Variance', ...metricRow('variance')]),
                    pad([]),
                    pad([`${(week.shiftLabel || '1st').toUpperCase()} SHIFT FILL %`, '', 'Daily Direct People', ...metricRow('dailyDirect')]),
                    pad([blank(week.kpi.shiftFillPct), '', 'Daily Fill %', ...metricRow('dailyFill')]),
                    pad([]),
                    pad(['', '', 'New Starts', ...metricRow('newStarts')]),
                    pad(['', '', 'Sent Home', ...metricRow('sentHome')]),
                    pad(['', '', 'Lines Cut', ...metricRow('linesCut')]),
                    pad(['', '', '2nd Day Returns', ...metricRow('secondDayReturns')]),
                    pad([]),
                    pad(['', '', 'Surveys Completed', ...metricRow('surveysCompleted')]),
                    pad(['', '', 'Early Leaves', ...metricRow('earlyLeaves')]),
                    pad(['', '', 'DNRs', ...metricRow('dnrs')])
                ];

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(aoa);
                ws['!cols'] = [{ wch: 18 }, { wch: 10 }, { wch: 24 }, ...week.days.map(() => ({ wch: 11 })), { wch: 13 }];
                ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 1 } }];

                // Number formats + the fill-rate colouring, mirroring the workbook.
                const fmt = (r, c, z, style) => {
                    const a = XLSX.utils.encode_cell({ r, c });
                    if (!ws[a] || ws[a].v === '') return;
                    ws[a].z = z;
                    if (style) ws[a].s = { ...(ws[a].s || {}), ...style };
                };
                const pctColor = (v) => {
                    if (v === null || v === undefined || isNaN(v)) return null;
                    if (v >= 0.99) return { font: { color: { rgb: '047857' }, bold: true } };
                    if (v >= 0.95) return { font: { color: { rgb: 'B45309' }, bold: true } };
                    return { font: { color: { rgb: 'B91C1C' }, bold: true } };
                };
                fmt(3, 0, '0.0');                                  // AVG. DAILY PC
                fmt(6, 0, '0.0%', pctColor(week.kpi.overallFillRate));
                fmt(9, 0, '0.0%', pctColor(week.kpi.shiftFillPct));
                // Daily Fill % row (index 9) across the day columns and the total.
                week.days.forEach((d, i) => fmt(9, 3 + i, '0.0%', pctColor(d.values.dailyFill)));
                fmt(9, 3 + week.days.length, '0.0%', pctColor(week.totals.dailyFill));
                // Variance keeps the workbook's red-negative format.
                for (let c = 3; c <= 3 + week.days.length; c++) fmt(6, c, '0;[Red]-0');
                // Bold the header row and the totals column.
                for (let c = 0; c < width; c++) fmt(0, c, 'General', { font: { bold: true } });
                for (let r = 2; r < aoa.length; r++) fmt(r, width - 1, ws[XLSX.utils.encode_cell({ r, c: width - 1 })]?.z || 'General', { font: { bold: true } });

                XLSX.utils.book_append_sheet(wb, ws, 'Scorecard');

                // A flat sheet as well, so the numbers can be pivoted or pasted
                // into the master workbook without re-typing.
                const flatHeader = ['Week_Ending', 'Date', 'Day', 'Shift', 'Avg_Daily_PC', 'Overall_Fill_Rate', '1st_Shift_Fill_Pct',
                    ...SCORECARD_ROWS.map(r => r.label)];
                const flat = [flatHeader];
                week.days.forEach(d => {
                    const dt = parseSheetDate(d.date);
                    flat.push([
                        week.weekEnding, d.date, DOW_LONG[dt.getDay()], week.shiftLabel,
                        blank(week.kpi.avgDailyPc), blank(week.kpi.overallFillRate), blank(week.kpi.shiftFillPct),
                        ...SCORECARD_ROWS.map(r => blank(d.values[r.id]))
                    ]);
                });
                const wsFlat = XLSX.utils.aoa_to_sheet(flat);
                wsFlat['!cols'] = flatHeader.map(h => ({ wch: Math.max(12, h.length + 2) }));
                XLSX.utils.book_append_sheet(wb, wsFlat, 'Scorecard_Flat');
                XLSX.writeFile(wb, `scorecard-week-ending-${week.weekEnding}.xlsx`);
            };

            const exportCsv = () => {
                const rows = [['Week Ending', 'Date', 'Day', 'Shift', ...SCORECARD_ROWS.map(r => r.label)]];
                week.days.forEach(d => {
                    const dt = parseSheetDate(d.date);
                    rows.push([week.weekEnding, d.date, DOW_LONG[dt.getDay()], week.shiftLabel,
                        ...SCORECARD_ROWS.map(r => {
                            const v = d.values[r.id];
                            return v === null || v === undefined ? '' : (r.percent ? (v * 100).toFixed(1) + '%' : v);
                        })]);
                });
                const csv = rows.map(r => r.map(c => {
                    const s = c === null || c === undefined ? '' : String(c);
                    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
                }).join(',')).join('\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `scorecard-week-ending-${week.weekEnding}.csv`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1500);
            };

            const kpiRow = (label, value, cls) => (
                <div className="sc-kpi">
                    <div className="sc-kpi-label">{label}</div>
                    <div className={`sc-kpi-value ${cls || ''}`}>{value}</div>
                </div>
            );

            return (
                <div className="panel-view">
                    <div className="filter-controls">
                        <div className="filter-row">
                            <button className="btn btn-secondary btn-small" onClick={() => setWeekEnding(w => shiftWeek(w, -1))}>‹ Prev</button>
                            <input
                                type="date"
                                value={weekEnding}
                                onChange={(e) => setWeekEnding(weekEndingOf(e.target.value))}
                                style={{ padding: '6px 8px', fontSize: '12px', borderRadius: '6px', border: '1px solid #d1d5db' }}
                            />
                            <button className="btn btn-secondary btn-small" onClick={() => setWeekEnding(w => shiftWeek(w, 1))}>Next ›</button>
                            <span style={{ fontSize: '12px', fontWeight: 700, color: '#374151' }}>Week ending {formatShortDate(weekEnding)}</span>
                            <button className="btn btn-secondary btn-small" onClick={() => setShowSettings(s => !s)}>
                                {showSettings ? 'Hide setup' : 'Setup'}
                            </button>
                            <div style={{ marginLeft: 'auto', display: 'flex', gap: '8px' }}>
                                <button className="btn btn-secondary btn-small" onClick={exportCsv}>Export CSV</button>
                                <button className="btn btn-primary btn-small" onClick={exportScorecard}>Export XLSX</button>
                            </div>
                        </div>
                    </div>

                    {showSettings && (
                        <div className="form-section" style={{ marginBottom: '16px' }}>
                            <h3>Scorecard Setup</h3>
                            <div className="form-grid">
                                <div className="form-group">
                                    <label>Account / Site</label>
                                    <input value={settingsDraft.site || ''} onChange={(e) => setSettingsDraft(s => ({ ...s, site: e.target.value }))} />
                                </div>
                                <div className="form-group">
                                    <label>Shift label</label>
                                    <input value={settingsDraft.shiftLabel || ''} onChange={(e) => setSettingsDraft(s => ({ ...s, shiftLabel: e.target.value }))} />
                                </div>
                            </div>
                            <div className="form-group">
                                <label>Days tracked (the day columns on each week block)</label>
                                <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                                    {DOW_LABELS.map((lbl, i) => {
                                        const on = (settingsDraft.workDays || []).includes(i);
                                        return (
                                            <button
                                                key={i}
                                                className={`day-toggle ${on ? 'on' : ''}`}
                                                onClick={() => setSettingsDraft(s => {
                                                    const cur = s.workDays || [];
                                                    return { ...s, workDays: on ? cur.filter(d => d !== i) : [...cur, i].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)) };
                                                })}
                                            >
                                                {lbl}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                            <button className="btn btn-success btn-small" onClick={() => { onSaveSettings('scorecard', settingsDraft); setShowSettings(false); }}>
                                Save setup
                            </button>
                        </div>
                    )}

                    <div className="sc-block">
                        <div className="sc-kpi-panel">
                            <div className="sc-site">{week.site}</div>
                            {kpiRow('AVG. DAILY PC', week.kpi.avgDailyPc === null ? '—' : week.kpi.avgDailyPc.toFixed(1))}
                            {kpiRow('OVERALL FILL RATE', week.kpi.overallFillRate === null ? '—' : fmtPct(week.kpi.overallFillRate), fillPctClass(week.kpi.overallFillRate))}
                            {kpiRow(`${(week.shiftLabel || '1st').toUpperCase()} SHIFT FILL %`, week.kpi.shiftFillPct === null ? '—' : fmtPct(week.kpi.shiftFillPct), fillPctClass(week.kpi.shiftFillPct))}
                            <div className="sc-kpi-note">
                                Overall fill rate is working ÷ confirmed. Shift fill % is working ÷ required.
                            </div>
                        </div>

                        <div className="sc-table-wrap">
                            <table className="sc-table">
                                <thead>
                                    <tr>
                                        <th className="sc-rowlabel">Week ending {formatShortDate(week.weekEnding)}</th>
                                        {week.days.map(d => {
                                            const dt = parseSheetDate(d.date);
                                            return <th key={d.date}>{DOW_LABELS[dt.getDay()]} {dt.getMonth() + 1}/{dt.getDate()}</th>;
                                        })}
                                        <th className="sc-total-col">TOTALS</th>
                                    </tr>
                                    <tr className="sc-subhead">
                                        <th className="sc-rowlabel">Shift</th>
                                        {week.days.map(d => <th key={d.date}>{week.shiftLabel}</th>)}
                                        <th className="sc-total-col">Week</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {SCORECARD_ROWS.map(row => (
                                        <tr key={row.id} className={row.kind === 'computed' ? 'sc-computed-row' : ''}>
                                            <td className="sc-rowlabel">
                                                {row.label}
                                                {row.kind === 'derived' && <span className="sc-tag" title="Filled in from the staffing sheets — type over it to override">auto</span>}
                                                {row.kind === 'computed' && <span className="sc-tag sc-tag-calc" title="Calculated">calc</span>}
                                            </td>
                                            {week.days.map(day => {
                                                const v = day.values[row.id];
                                                if (row.kind === 'computed') {
                                                    return (
                                                        <td key={day.date} className={`sc-calc ${row.percent ? fillPctClass(v) : ''}`}>
                                                            {row.percent ? (v === null ? '' : fmtPct(v))
                                                                : fmtNum(v, row.signed)}
                                                        </td>
                                                    );
                                                }
                                                const derivedValue = row.kind === 'derived' ? day.derived[row.id] : null;
                                                const stored = cellValue(row, day);
                                                const overridden = row.kind === 'derived' && stored !== '';
                                                // A derived cell shows the number it worked out; typing
                                                // replaces it with an override and ↺ hands it back.
                                                const shown = row.kind === 'derived' && !overridden
                                                    ? (derivedValue === null || derivedValue === undefined ? '' : derivedValue)
                                                    : stored;
                                                return (
                                                    <td key={day.date} className={row.kind === 'derived' ? 'sc-derived' : 'sc-manual'}>
                                                        <div className="sc-cell">
                                                            <input
                                                                type="number"
                                                                className={overridden ? 'sc-overridden' : ''}
                                                                value={shown}
                                                                onChange={(e) => onUpdateScorecard(
                                                                    week.weekEnding, day.date,
                                                                    row.kind === 'derived' ? 'overrides' : 'manual',
                                                                    row.id, e.target.value
                                                                )}
                                                                title={row.kind === 'derived'
                                                                    ? `From the staffing sheets${derivedValue === null || derivedValue === undefined ? ' (no sheet saved for this day yet)' : `: ${derivedValue}`}. Type a number to override.`
                                                                    : 'Enter a number'}
                                                            />
                                                            {overridden && (
                                                                <button
                                                                    className="sc-reset"
                                                                    title={`Overridden. Go back to ${derivedValue === null || derivedValue === undefined ? 'blank' : derivedValue} from the staffing sheets.`}
                                                                    onClick={() => onUpdateScorecard(week.weekEnding, day.date, 'overrides', row.id, '')}
                                                                >
                                                                    ↺
                                                                </button>
                                                            )}
                                                        </div>
                                                    </td>
                                                );
                                            })}
                                            <td className="sc-total-col">
                                                {row.percent ? fmtPct(week.totals[row.id]) : fmtNum(week.totals[row.id], row.signed)}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="quick-add-hint" style={{ marginTop: '12px' }}>
                        <strong>Required</strong> is every spot created on the day's lines, <strong>Working - Direct Only</strong> is
                        how many were filled, and <strong>Confirmed</strong> counts the confirmations logged on the Attendance tab.
                        New Starts and Lines Cut come from the sheet too. Anything the planner can't see —
                        Forecasted, Sent Home, 2nd Day Returns, Surveys, Early Leaves and DNRs — stays an editable field.
                    </div>
                </div>
            );
        }

        // Builds the daily headcount-confirmation email off the live board,
        // following the layout of the "Email HC Confirmation" tab: total
        // headcount, then ORDERED / FILLED / NOT FILLED / Comments per line.
        function EmailPrepModal({ lines, currentDate, emailSettings, attendanceWeek, roster, placementIndex, onUpdateLine, onSaveSettings, onClose }) {
            const [settingsDraft, setSettingsDraft] = useState(emailSettings);
            const [showSettings, setShowSettings] = useState(!(emailSettings && emailSettings.recipients));
            const [comments, setComments] = useState({}); // lineId -> one-off comment
            const [copied, setCopied] = useState('');

            // Confirmed vs showed for the day, so the email can carry the metric.
            const extras = React.useMemo(() => {
                const entries = (attendanceWeek && attendanceWeek.entries) || {};
                let confirmed = 0, showed = 0;
                Object.entries(roster || {}).forEach(([key, a]) => {
                    if (!(a.fullName || '').trim()) return;
                    const res = resolveAttendance(a, currentDate, placementIndex, entries[key]);
                    if (res.confirmed) confirmed += 1;
                    if (res.status === 'present') showed += 1;
                });
                return { confirmed, showed, showRate: confirmed ? showed / confirmed : null };
            }, [attendanceWeek, roster, placementIndex, currentDate]);

            const prep = React.useMemo(() => {
                const base = buildEmailPrep(lines, currentDate, settingsDraft, extras);
                return {
                    ...base,
                    rows: base.rows.map(r => ({ ...r, comment: comments[r.id] !== undefined ? comments[r.id] : r.comment }))
                };
            }, [lines, currentDate, settingsDraft, comments, extras]);

            const bodyText = emailPrepText(prep);

            // The body is copied as rich HTML where the browser allows it, so the
            // table lands in Outlook as a table rather than as runs of spaces.
            const copy = async (what, text, html) => {
                try {
                    if (html && typeof ClipboardItem !== 'undefined' && navigator.clipboard && navigator.clipboard.write) {
                        await navigator.clipboard.write([new ClipboardItem({
                            'text/html': new Blob([html], { type: 'text/html' }),
                            'text/plain': new Blob([text], { type: 'text/plain' })
                        })]);
                    } else {
                        await navigator.clipboard.writeText(text);
                    }
                    setCopied(what);
                    setTimeout(() => setCopied(''), 2000);
                } catch (e) {
                    // Clipboard API needs a secure context; fall back to selecting.
                    setCopied('failed');
                    setTimeout(() => setCopied(''), 3000);
                }
            };

            const openInMail = () => {
                const url = `mailto:${encodeURIComponent(prep.recipients)}?subject=${encodeURIComponent(prep.subject)}&body=${encodeURIComponent(bodyText)}`;
                window.location.href = url;
            };

            return (
                <div className="quick-add-modal" onClick={onClose}>
                    <div className="quick-add-content panel-view" style={{ maxWidth: '860px', width: '94%' }} onClick={(e) => e.stopPropagation()}>
                        <div className="quick-add-header">
                            <h3 className="quick-add-title">Email Prep — {formatShortDate(currentDate)}</h3>
                            <div style={{ display: 'flex', gap: '8px' }}>
                                <button className="btn btn-secondary btn-small" onClick={() => setShowSettings(s => !s)}>
                                    {showSettings ? 'Hide recipients' : 'Recipients'}
                                </button>
                                <button className="btn btn-secondary btn-small" onClick={onClose}>×</button>
                            </div>
                        </div>

                        {showSettings && (
                            <div className="form-section" style={{ marginBottom: '12px' }}>
                                <div className="form-group">
                                    <label>To</label>
                                    <textarea
                                        rows={2}
                                        value={settingsDraft.recipients || ''}
                                        placeholder="Name &lt;name@company.com&gt;; Name &lt;name@company.com&gt;"
                                        onChange={(e) => setSettingsDraft(s => ({ ...s, recipients: e.target.value }))}
                                    />
                                </div>
                                <div className="form-grid">
                                    <div className="form-group">
                                        <label>Site</label>
                                        <input value={settingsDraft.site || ''} onChange={(e) => setSettingsDraft(s => ({ ...s, site: e.target.value }))} />
                                    </div>
                                    <div className="form-group">
                                        <label>Subject template</label>
                                        <input
                                            value={settingsDraft.subjectTemplate || ''}
                                            onChange={(e) => setSettingsDraft(s => ({ ...s, subjectTemplate: e.target.value }))}
                                            title="{site} {day} {m}/{d} — {date} for the ISO date"
                                        />
                                    </div>
                                </div>
                                <button className="btn btn-success btn-small" onClick={() => { onSaveSettings('email', settingsDraft); setShowSettings(false); }}>
                                    Save as default
                                </button>
                            </div>
                        )}

                        <div className="email-meta">
                            <div><span className="email-meta-label">To</span> {prep.recipients || <em style={{ color: '#9ca3af' }}>set recipients above</em>}</div>
                            <div><span className="email-meta-label">Subject</span> {prep.subject}</div>
                        </div>

                        <div className="email-total">Total Headcount: {prep.totals.filled}</div>

                        <div style={{ maxHeight: '38vh', overflowY: 'auto', border: '1px solid #e5e7eb', borderRadius: '6px' }}>
                            <table className="email-table">
                                <thead>
                                    <tr>
                                        <th style={{ width: '90px' }}></th>
                                        <th>Description</th>
                                        <th style={{ width: '80px' }}>ORDERED</th>
                                        <th style={{ width: '70px' }}>FILLED</th>
                                        <th style={{ width: '90px' }}>NOT FILLED</th>
                                        <th style={{ width: '200px' }}>Comments</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {prep.rows.map(r => (
                                        <tr key={r.id} className={r.isCut ? 'email-cut' : ''}>
                                            <td><strong>{r.label}</strong></td>
                                            <td>
                                                <input
                                                    defaultValue={r.description}
                                                    placeholder="e.g. Chomps - Auto"
                                                    onBlur={(e) => onUpdateLine(r.id, { description: e.target.value })}
                                                    title="Saved on the line, so it carries over to the next email"
                                                />
                                            </td>
                                            <td className="email-num">{r.ordered}</td>
                                            <td className="email-num">{r.filled}</td>
                                            <td className={`email-num ${r.notFilled > 0 ? 'email-short' : ''}`}>{r.notFilled}</td>
                                            <td>
                                                <input
                                                    value={comments[r.id] !== undefined ? comments[r.id] : r.comment}
                                                    onChange={(e) => setComments(c => ({ ...c, [r.id]: e.target.value }))}
                                                />
                                            </td>
                                        </tr>
                                    ))}
                                    <tr className="email-totals-row">
                                        <td><strong>Total</strong></td>
                                        <td></td>
                                        <td className="email-num">{prep.totals.ordered}</td>
                                        <td className="email-num">{prep.totals.filled}</td>
                                        <td className="email-num">{prep.totals.notFilled}</td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div className="email-extras">
                            Confirmed <strong>{extras.confirmed}</strong> · Showed <strong>{extras.showed}</strong>
                            {extras.showRate !== null && <> · <span className={fillPctClass(extras.showRate)}>{fmtPct(extras.showRate)} show rate</span></>}
                        </div>

                        <div style={{ display: 'flex', gap: '8px', justifyContent: 'flex-end', marginTop: '14px', flexWrap: 'wrap' }}>
                            {copied && (
                                <span style={{ marginRight: 'auto', fontSize: '12px', fontWeight: 600, color: copied === 'failed' ? '#991b1b' : '#059669' }}>
                                    {copied === 'failed' ? 'Copy failed — select the text and copy manually.' : `Copied ${copied} ✓`}
                                </span>
                            )}
                            <button className="btn btn-secondary" onClick={() => copy('subject', prep.subject)}>Copy Subject</button>
                            <button className="btn btn-secondary" onClick={() => copy('recipients', prep.recipients)} disabled={!prep.recipients}>Copy To</button>
                            <button className="btn btn-secondary" onClick={() => copy('table', bodyText, emailPrepHtml(prep))}>Copy Body</button>
                            <button className="btn btn-success" onClick={openInMail}>Open in Mail</button>
                        </div>

                        <details style={{ marginTop: '10px' }}>
                            <summary style={{ cursor: 'pointer', fontSize: '12px', color: '#6b7280' }}>Plain-text preview</summary>
                            <pre className="email-preview">{bodyText}</pre>
                        </details>
                    </div>
                </div>
            );
        }

        function LoginScreen() {
            const [mode, setMode] = useState('signin'); // 'signin' | 'signup'
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirm, setConfirm] = useState('');
            const [error, setError] = useState('');
            const [note, setNote] = useState('');
            const [busy, setBusy] = useState(false);
            const isSignup = mode === 'signup';

            const switchMode = (next) => {
                setMode(next);
                setError('');
                setNote('');
                setConfirm('');
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setNote('');
                if (isSignup) {
                    if (password.length < 6) {
                        setError('Password must be at least 6 characters.');
                        return;
                    }
                    if (password !== confirm) {
                        setError('Passwords don’t match.');
                        return;
                    }
                }
                setBusy(true);
                try {
                    if (isSignup) {
                        const cred = await auth.createUserWithEmailAndPassword(email.trim(), password);
                        recordUserSession(cred.user, true);
                        logActivity('account_created', (cred.user && cred.user.email) || email.trim());
                    } else {
                        const cred = await auth.signInWithEmailAndPassword(email.trim(), password);
                        recordUserSession(cred.user, true);
                    }
                    // On success, onAuthStateChanged in Root swaps to the app.
                } catch (err) {
                    setError(mapAuthError(err));
                    setBusy(false);
                }
            };

            const handleForgot = async () => {
                setError('');
                setNote('');
                const addr = email.trim();
                if (!addr) {
                    setError('Enter your email address above first, then tap “Forgot password?”.');
                    return;
                }
                try {
                    await auth.sendPasswordResetEmail(addr);
                    setNote('If an account exists for ' + addr + ', a password-reset email is on its way.');
                } catch (err) {
                    // Don't reveal whether the address exists; only surface real config errors.
                    if (err && err.code === 'auth/invalid-email') {
                        setError('That email address doesn’t look right.');
                    } else {
                        setNote('If an account exists for ' + addr + ', a password-reset email is on its way.');
                    }
                }
            };

            const canSubmit = email && password && (!isSignup || confirm);

            return (
                <div className="auth-screen">
                    <form className="auth-card" onSubmit={handleSubmit}>
                        <div className="auth-card-header">
                            <h1>Line Planner</h1>
                            <p>{isSignup ? 'Create your account' : 'Sign in to continue'}</p>
                        </div>
                        <div className="auth-card-body">
                            {error && <div className="auth-error">{error}</div>}
                            {note && <div className="auth-note success">{note}</div>}
                            <div className="auth-field">
                                <label htmlFor="auth-email">Email</label>
                                <input
                                    id="auth-email"
                                    type="email"
                                    autoComplete="username"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    disabled={busy}
                                    autoFocus
                                />
                            </div>
                            <div className="auth-field">
                                <label htmlFor="auth-password">Password</label>
                                <input
                                    id="auth-password"
                                    type="password"
                                    autoComplete={isSignup ? 'new-password' : 'current-password'}
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    disabled={busy}
                                />
                            </div>
                            {isSignup && (
                                <div className="auth-field">
                                    <label htmlFor="auth-confirm">Confirm password</label>
                                    <input
                                        id="auth-confirm"
                                        type="password"
                                        autoComplete="new-password"
                                        value={confirm}
                                        onChange={(e) => setConfirm(e.target.value)}
                                        disabled={busy}
                                    />
                                </div>
                            )}
                            <button type="submit" className="auth-submit" disabled={busy || !canSubmit}>
                                {busy ? (isSignup ? 'Creating account…' : 'Signing in…')
                                      : (isSignup ? 'Create Account' : 'Sign In')}
                            </button>
                            {!isSignup && (
                                <button type="button" className="auth-forgot" onClick={handleForgot} disabled={busy}>
                                    Forgot password?
                                </button>
                            )}
                            <div className="auth-switch">
                                {isSignup ? (
                                    <span>Already have an account?{' '}
                                        <button type="button" onClick={() => switchMode('signin')} disabled={busy}>
                                            Sign in
                                        </button>
                                    </span>
                                ) : (
                                    <span>Need an account?{' '}
                                        <button type="button" onClick={() => switchMode('signup')} disabled={busy}>
                                            Create one
                                        </button>
                                    </span>
                                )}
                            </div>
                        </div>
                    </form>
                </div>
            );
        }

        // Root decides between the login gate and the app based on auth state.
        function Root() {
            // 'checking' until Firebase reports the restored session; then 'in' or 'out'.
            const [authState, setAuthState] = useState(isAuthEnabled ? 'checking' : 'in');
            const [user, setUser] = useState(null);

            useEffect(() => {
                if (!isAuthEnabled) return;
                const unsub = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setAuthState(u ? 'in' : 'out');
                    if (u) recordUserSession(u, false); // session restore / app open
                });
                return unsub;
            }, []);

            if (authState === 'checking') {
                return (
                    <div className="auth-screen">
                        <div style={{ color: '#6b7280', fontSize: '13px' }}>Loading…</div>
                    </div>
                );
            }
            if (authState === 'out') return <LoginScreen />;
            return <App user={user} />;
        }

        ReactDOM.render(<Root />, document.getElementById('root'));
    </script>
</body>
</html>
